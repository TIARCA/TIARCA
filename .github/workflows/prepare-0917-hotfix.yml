name: Prepare 0.9.1.7 hotfix metadata

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/prepare-0917-hotfix.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/0.9.1.7-hotfix
          fetch-depth: 0
      - name: Update changelog and README
        shell: python
        run: |
          from pathlib import Path
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          header = "# TIARCA — Changelog\n\n"
          entry = "## v0.9.1.7\n\n- Corretto il routing delle conversazioni private quando un utente cambia nickname e poi torna a un nickname precedente: la cronologia degli alias viene normalizzata senza cicli, evitando messaggi ricevuti invisibili nella query aperta.\n- Aggiunti test di regressione per sequenze `A → B → A` e per catene più lunghe di cambi nickname.\n\n"
          if '## v0.9.1.7' not in text:
              if not text.startswith(header):
                  raise SystemExit('Unexpected CHANGELOG header')
              changelog.write_text(header + entry + text[len(header):])

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace('## Ultima release — TIARCA 0.9.1.6', '## Ultima release — TIARCA 0.9.1.7')
          r = r.replace('La release stabile corrente è **TIARCA 0.9.1.6**.', 'La release stabile corrente è **TIARCA 0.9.1.7**.')
          r = r.replace('[Scarica TIARCA 0.9.1.6 APK](https://github.com/TIARCA/TIARCA/releases/download/v0.9.1.6/TIARCA-v0.9.1.6.apk)', '[Scarica TIARCA 0.9.1.7 APK](https://github.com/TIARCA/TIARCA/releases/download/v0.9.1.7/TIARCA-v0.9.1.7.apk)')
          r = r.replace('[Pagina della release 0.9.1.6](https://github.com/TIARCA/TIARCA/releases/tag/v0.9.1.6)', '[Pagina della release 0.9.1.7](https://github.com/TIARCA/TIARCA/releases/tag/v0.9.1.7)')
          old = 'La 0.9.1.6 amplia il motore condiviso delle modalità IRC con descrizioni più precise e profili dedicati per SimosNap, IRCnet, Undernet e Libera.Chat, migliorando sia **Modalità del canale** sia **Modalità utente** senza inventare il significato dei mode non riconosciuti.'
          new = 'La 0.9.1.7 corregge un problema nelle conversazioni private quando un utente cambia nickname e poi torna a un nickname precedente: TIARCA mantiene ora una sola identità coerente della query e continua a mostrare correttamente i messaggi ricevuti.'
          if old not in r:
              raise SystemExit('Expected README release description not found')
          readme.write_text(r.replace(old, new, 1))
      - name: Commit metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md README.md
          git commit -m 'Document TIARCA 0.9.1.7 hotfix'
          git push origin HEAD:release/0.9.1.7-hotfix
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/prepare-0917-hotfix.yml
          git commit -m 'Remove temporary 0.9.1.7 preparation workflow'
          git push origin main
