name: Apply UI 0.9.2 patch

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/ui-0.9.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-0.9.2
          fetch-depth: 0
      - name: Apply targeted patch
        shell: python
        run: |
          from pathlib import Path

          menu_path = Path('app/src/main/res/menu/menu_chat.xml')
          menu = menu_path.read_text()
          old_send = '    <item android:id="@+id/action_send_media" android:title="@string/file_send_menu" android:visible="false" app:showAsAction="never" />'
          new_send = '''    <item android:id="@+id/action_send_media" android:title="@string/file_send_menu" android:icon="@drawable/ic_file_upload_white_16dp" android:visible="false" app:showAsAction="ifRoom" />\n    <item android:id="@+id/action_direct_ignore" android:title="@string/action_ignore_user" android:icon="@drawable/ic_close" android:visible="false" app:showAsAction="ifRoom" />'''
          assert old_send in menu
          menu = menu.replace(old_send, new_send, 1)
          closing = '    <item android:id="@+id/action_format" android:title="@string/message_format" android:visible="false" app:showAsAction="never" />\n</menu>'
          replacement = '    <item android:id="@+id/action_format" android:title="@string/message_format" android:visible="false" app:showAsAction="never" />\n    <item android:id="@+id/action_settings" android:title="@string/action_settings" app:showAsAction="never" />\n</menu>'
          assert closing in menu
          menu_path.write_text(menu.replace(closing, replacement, 1))

          main_path = Path('app/src/main/java/io/mrarm/irc/MainActivity.java')
          main = main_path.read_text()
          vis = '''            menu.findItem(R.id.action_send_media).setVisible(connected && inDirectChat &&\n                    SharingSettings.hasAnySendOption(this));\n            menu.findItem(R.id.action_direct_whois).setVisible(connected && inDirectChat);'''
          vis_new = '''            menu.findItem(R.id.action_send_media).setVisible(connected && inDirectChat &&\n                    SharingSettings.hasAnySendOption(this));\n            menu.findItem(R.id.action_direct_ignore).setVisible(inDirectChat);\n            menu.findItem(R.id.action_direct_whois).setVisible(connected && inDirectChat);'''
          assert vis in main
          main = main.replace(vis, vis_new, 1)
          handler = '''        } else if (id == R.id.action_send_media) {\n            ChatFragment fragment = (ChatFragment) getCurrentFragment();\n            SimosnapSendMenu.show(this, fragment.getConnectionInfo(),\n                    fragment.getCurrentChannel());\n        } else if (id == R.id.action_direct_whois) {'''
          handler_new = '''        } else if (id == R.id.action_send_media) {\n            ChatFragment fragment = (ChatFragment) getCurrentFragment();\n            SimosnapSendMenu.show(this, fragment.getConnectionInfo(),\n                    fragment.getCurrentChannel());\n        } else if (id == R.id.action_direct_ignore) {\n            ChatFragment fragment = (ChatFragment) getCurrentFragment();\n            io.mrarm.irc.dialog.IgnoreUserDialog.show(this, fragment.getConnectionInfo(),\n                    fragment.getCurrentChannel(), null, null);\n        } else if (id == R.id.action_direct_whois) {'''
          assert handler in main
          main_path.write_text(main.replace(handler, handler_new, 1))

          gradle_path = Path('app/build.gradle')
          gradle = gradle_path.read_text()
          assert 'versionCode 90183' in gradle and 'versionName "0.9.1.8c"' in gradle
          gradle = gradle.replace('versionCode 90183', 'versionCode 90200', 1)
          gradle = gradle.replace('versionName "0.9.1.8c"', 'versionName "0.9.2"', 1)
          gradle_path.write_text(gradle)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          marker = '# TIARCA — Changelog\n\n'
          assert marker in changelog and '## v0.9.2' not in changelog
          section = '''## v0.9.2\n\n- Nei PVT aggiunti in barra superiore i pulsanti rapidi **Invia** e **Ignora**, riutilizzando le stesse azioni già disponibili nel pannello WHOIS.\n- La voce **Impostazioni** è ora sempre presente in fondo al menu `...` anche nelle schermate chat.\n- L'apertura volontaria di un PVT aggiunge automaticamente il nickname alla lista `ACCEPT` solo quando la modalità utente `+g` è realmente attiva.\n- **Utenti monitorati** è stato portato nella posizione superiore del drawer principale al posto della vecchia voce Cerca.\n\n'''
          changelog_path.write_text(changelog.replace(marker, marker + section, 1))

          Path('.github/workflows/apply-ui-092.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "TIARCA UI patch"
          git config user.email "actions@github.com"
          git add app/src/main/res/menu/menu_chat.xml app/src/main/java/io/mrarm/irc/MainActivity.java app/build.gradle CHANGELOG.md .github/workflows/apply-ui-092.yml
          git commit -m "Prepare TIARCA 0.9.2 UI"
          git push origin HEAD:feature/ui-0.9.2
