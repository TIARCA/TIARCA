name: Publish TIARCA 0.9.1.8

on:
  push:
    paths:
      - '.github/workflows/publish-0918.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: 5bfab58dcbc8dc7b0bc95ab67e543f9ead3a94cf
      VERSION: 0.9.1.8
      TAG: v0.9.1.8
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Verify exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          grep -q 'versionCode 9018' app/build.gradle
          grep -q 'versionName "0.9.1.8"' app/build.gradle
          grep -q '^## v0.9.1.8$' CHANGELOG.md
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Restore release keystore
        shell: bash
        run: echo '${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}' | base64 --decode > tiarca-release.jks
      - name: Create keystore properties
        shell: bash
        run: |
          cat > keystore.properties <<EOF
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF
      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease
      - name: Prepare APK checksum and notes
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$APK" "TIARCA-v${VERSION}.apk"
          sha256sum "TIARCA-v${VERSION}.apk" > "TIARCA-v${VERSION}.apk.sha256"
          awk -v header="## v${VERSION}" '$0 == header { found=1; next } found && /^## v/ { exit } found { print }' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create exact tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          git tag "$TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" "TIARCA-v${VERSION}.apk" "TIARCA-v${VERSION}.apk.sha256" --title "TIARCA v${VERSION}" --notes-file release-notes.md --verify-tag
      - name: Remove temporary publisher
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch origin main
          git checkout -B cleanup origin/main
          if [ -f .github/workflows/publish-0918.yml ]; then
            git rm .github/workflows/publish-0918.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Remove temporary 0.9.1.8 publisher'
            git push origin HEAD:main
          fi
