name: Validate Gradle 8.14.6 (isolated)

on:
  push:
    branches:
      - validation/gradle-8.14.6

permissions:
  contents: read

jobs:
  candidate:
    name: Signed candidate (Standard and F-Droid)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main source commit
        uses: actions/checkout@v5
        with:
          ref: b8371fbf46aad62ff9c5594b7ffd026d32ff09ac

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks
          test -s tiarca-release.jks

      - name: Create keystore.properties
        shell: bash
        run: |
          cat > keystore.properties <<EOF2
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF2

      - name: Build signed candidate APKs
        run: ./gradlew :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Verify distribution APKs
        run: |
          python3 tools/verify_distribution_apk.py Standard
          python3 tools/verify_distribution_apk.py Fdroid

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          for FLAVOR in standard fdroid; do
            APK=$(find "app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            test -n "$APK"
            "$APKSIGNER" verify --verbose "$APK"
          done

      - name: Collect candidate APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-apks
          for FLAVOR in standard fdroid; do
            APK=$(find "app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            cp "$APK" "candidate-apks/TIARCA-$FLAVOR-candidate-b8371fb.apk"
          done
          (cd candidate-apks && sha256sum *.apk > SHA256SUMS)

      - name: Upload candidate artifacts (no release)
        uses: actions/upload-artifact@v6
        with:
          name: TIARCA-gradle8146-candidate-b8371fb
          path: candidate-apks/
          retention-days: 14

  reproducible:
    name: Independent unsigned builds, byte-for-byte comparison
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - name: Checkout build A
        uses: actions/checkout@v5
        with:
          ref: b8371fbf46aad62ff9c5594b7ffd026d32ff09ac
          path: build-a
          fetch-depth: 1

      - name: Checkout build B
        uses: actions/checkout@v5
        with:
          ref: b8371fbf46aad62ff9c5594b7ffd026d32ff09ac
          path: build-b
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare identical build environment
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build-a/gradlew build-b/gradlew
          SOURCE_DATE_EPOCH=$(git -C build-a show -s --format=%ct HEAD)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          echo "Verified source: $(git -C build-a rev-parse HEAD)"
          test "$(git -C build-a rev-parse HEAD)" = "$(git -C build-b rev-parse HEAD)"

      - name: Independent unsigned build A
        working-directory: build-a
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-a
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Independent unsigned build B
        working-directory: build-b
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-b
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Compare APKs byte for byte
        shell: bash
        run: |
          set -euo pipefail
          for FLAVOR in standard fdroid; do
            APK_A=$(find "build-a/app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            APK_B=$(find "build-b/app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            test -n "$APK_A"
            test -n "$APK_B"
            echo "$FLAVOR, build A:"
            sha256sum "$APK_A"
            echo "$FLAVOR, build B:"
            sha256sum "$APK_B"
            cmp "$APK_A" "$APK_B"
            echo "$FLAVOR: byte-for-byte identical"
          done
