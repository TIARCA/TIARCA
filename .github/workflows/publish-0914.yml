name: Publish TIARCA 0.9.1.4

on:
  push:
    paths:
      - '.github/workflows/publish-0914.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: 8b2b3fce24960ee7481ae1f84e6e51a3a6ec0d71
          fetch-depth: 0

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 9014' app/build.gradle
          grep -q 'versionName "0.9.1.4"' app/build.gradle
          grep -q '^## v0.9.1.4$' CHANGELOG.md

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.9.1.4 >/dev/null 2>&1; then
            echo 'Tag v0.9.1.4 already exists'
          else
            git tag v0.9.1.4 8b2b3fce24960ee7481ae1f84e6e51a3a6ec0d71
            git push origin refs/tags/v0.9.1.4
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks

      - name: Create keystore.properties
        shell: bash
        run: |
          cat > keystore.properties <<EOF
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Name and checksum release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          OUTPUT='app/build/outputs/apk/release/TIARCA-v0.9.1.4.apk'
          cp "$APK" "$OUTPUT"
          (cd "$(dirname "$OUTPUT")" && sha256sum "$(basename "$OUTPUT")") > "${OUTPUT}.sha256"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          awk '
            $0 == "## v0.9.1.4" { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          printf '\n**Full Changelog**: https://github.com/TIARCA/TIARCA/compare/v0.9.1.3...v0.9.1.4\n' >> release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.9.1.4 >/dev/null 2>&1; then
            gh release upload v0.9.1.4 \
              app/build/outputs/apk/release/TIARCA-v0.9.1.4.apk \
              app/build/outputs/apk/release/TIARCA-v0.9.1.4.apk.sha256 \
              --clobber
          else
            gh release create v0.9.1.4 \
              app/build/outputs/apk/release/TIARCA-v0.9.1.4.apk \
              app/build/outputs/apk/release/TIARCA-v0.9.1.4.apk.sha256 \
              --title 'TIARCA v0.9.1.4' \
              --notes-file release-notes.md
          fi
