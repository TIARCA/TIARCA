name: Validate AGP 8.13.2 and Gradle Wrapper (temporary)

on:
  push:
    branches:
      - validation/wrapper-agp-8.13.2

permissions:
  contents: read

jobs:
  candidate:
    name: Signed candidate APKs (Standard, F-Droid)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR source commit
        uses: actions/checkout@v5
        with:
          ref: 5c436035110cb8a64548ada4c9e2bca924d18265

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify official Gradle Wrapper JAR
        shell: bash
        run: |
          echo 'ad16bca46cb71bb5887c546860d93992aeee35c1fdaf4a242b0a612375d937e0  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          grep -Fx 'distributionSha256Sum=7988ed071b2a07900e2ec715fca15c6ab72bce6db433af301fa7fa7e9407bd24' gradle/wrapper/gradle-wrapper.properties

      - name: Restore signing
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks
          test -s tiarca-release.jks
          cat > keystore.properties <<EOF
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed release APKs
        run: ./gradlew :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Verify both distribution APKs
        run: |
          python3 tools/verify_distribution_apk.py Standard
          python3 tools/verify_distribution_apk.py Fdroid

      - name: Verify signatures and established certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          for FLAVOR in standard fdroid; do
            APK=$(find "app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            test -n "$APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "/tmp/$FLAVOR-signing.txt"
            grep -qi 'e2141ddf7765bfe99b0eb34cae636cefde0228aeeb1a100ddd8c9d6c8e7718a7' "/tmp/$FLAVOR-signing.txt"
          done

      - name: Collect Candidate artifacts (do not publish release)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-apks
          for FLAVOR in standard fdroid; do
            APK=$(find "app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            test -n "$APK"
            cp "$APK" "candidate-apks/TIARCA-$FLAVOR-agp8132-5c43603.apk"
          done
          (cd candidate-apks && sha256sum *.apk > SHA256SUMS)

      - name: Upload signed APKs
        uses: actions/upload-artifact@v6
        with:
          name: TIARCA-agp8132-candidate-5c43603
          path: candidate-apks/
          retention-days: 14

  reproducible:
    name: Reproducible unsigned release APKs
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - name: Checkout independent A
        uses: actions/checkout@v5
        with:
          ref: 5c436035110cb8a64548ada4c9e2bca924d18265
          path: build-a
          fetch-depth: 1

      - name: Checkout independent B
        uses: actions/checkout@v5
        with:
          ref: 5c436035110cb8a64548ada4c9e2bca924d18265
          path: build-b
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare isolated deterministic environments
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git -C build-a show -s --format=%ct HEAD)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          test "$(git -C build-a rev-parse HEAD)" = "$(git -C build-b rev-parse HEAD)"
          echo 'ad16bca46cb71bb5887c546860d93992aeee35c1fdaf4a242b0a612375d937e0  build-a/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          echo 'ad16bca46cb71bb5887c546860d93992aeee35c1fdaf4a242b0a612375d937e0  build-b/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check

      - name: Independent build A
        working-directory: build-a
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-a
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Independent build B
        working-directory: build-b
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-b
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Compare independent APKs byte for byte
        shell: bash
        run: |
          set -euo pipefail
          for FLAVOR in standard fdroid; do
            APK_A=$(find "build-a/app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            APK_B=$(find "build-b/app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            test -n "$APK_A"
            test -n "$APK_B"
            echo "$FLAVOR build A"
            sha256sum "$APK_A"
            echo "$FLAVOR build B"
            sha256sum "$APK_B"
            cmp "$APK_A" "$APK_B"
            echo "$FLAVOR: byte-for-byte identical"
          done
