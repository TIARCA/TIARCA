name: Build TIARCA Candidate

on:
  workflow_dispatch:

jobs:
  build-candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks

      - name: Create keystore.properties
        shell: bash
        run: |
          cat > keystore.properties <<EOF2
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF2

      - name: Build signed candidate APK
        run: ./gradlew :app:assembleRelease

      - name: Name candidate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [[ -z "$APK" ]]; then
            echo "Candidate APK was not generated" >&2
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          OUTPUT="app/build/outputs/apk/release/TIARCA-candidate-${SHORT_SHA}.apk"
          cp "$APK" "$OUTPUT"
          echo "apk=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: TIARCA-candidate-${{ github.sha }}
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 14
