name: Build TIARCA Candidate

on:
  workflow_dispatch:

jobs:
  build-candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks

      - name: Create keystore.properties
        shell: bash
        run: |
          cat > keystore.properties <<EOF2
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF2

      - name: Build signed candidate APK
        run: ./gradlew :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Verify distribution APKs
        run: |
          python3 tools/verify_distribution_apk.py Standard
          python3 tools/verify_distribution_apk.py Fdroid

      - name: Name candidate APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-apks
          for FLAVOR in standard fdroid; do
            APK=$(find "app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -name "*.apk" | head -n 1)
            test -n "$APK"
            cp "$APK" "candidate-apks/TIARCA-$FLAVOR-candidate-${GITHUB_SHA::7}.apk"
          done

      - name: Upload candidate APKs
        uses: actions/upload-artifact@v6
        with:
          name: TIARCA-candidate-${{ github.sha }}
          path: candidate-apks/*.apk
          retention-days: 14
