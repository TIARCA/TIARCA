name: Fix TIARCA-026 CI

on:
  push:
    branches:
      - feature/tiarca-026-nick-tap-action
    paths:
      - .github/workflows/tiarca-026-fix-ci.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/tiarca-026-nick-tap-action
          fetch-depth: 0
      - name: Apply compile fix
        run: python tools/tiarca026_fix_ci.py
      - name: Commit fix and remove helpers
        run: |
          set -euo pipefail
          git rm .github/workflows/tiarca-026-fix-ci.yml tools/tiarca026_fix_ci.py
          git add app/src/main/java/io/mrarm/irc/chat/ChatMessagesAdapter.java
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "TIARCA-026: route nickname insertion through chat parent"
          git push origin HEAD:feature/tiarca-026-nick-tap-action
