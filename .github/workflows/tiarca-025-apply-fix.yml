name: Apply TIARCA-025 fix

on:
  push:
    branches:
      - fix/tiarca-025-jump-to-latest

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/tiarca-025-jump-to-latest
          fetch-depth: 0

      - name: Apply jump-to-latest fix and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/io/mrarm/irc/chat/ChatMessagesFragment.java')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    private boolean mIsLoadingMore;\n',
              '    private boolean mIsLoadingMore;\n    private volatile int mMessageWindowGeneration;\n',
              'generation field')

          replace_once(
              '''                    Log.i(TAG, "Load more (older): " + mChannelName);\n                    mIsLoadingMore = true;\n                    mConnection.getApiInstance().getMessageStorageApi().getMessages(mChannelName,\n''',
              '''                    Log.i(TAG, "Load more (older): " + mChannelName);\n                    mIsLoadingMore = true;\n                    final int generation = mMessageWindowGeneration;\n                    mConnection.getApiInstance().getMessageStorageApi().getMessages(mChannelName,\n''',
              'older generation capture')

          replace_once(
              '''                            (MessageList messages) -> {\n                                updateMessageList(() -> {\n                                    mAdapter.addMessagesToTop(messages.getMessages(),\n                                            messages.getMessageIds());\n''',
              '''                            (MessageList messages) -> {\n                                updateMessageList(() -> {\n                                    if (generation != mMessageWindowGeneration)\n                                        return;\n                                    mAdapter.addMessagesToTop(messages.getMessages(),\n                                            messages.getMessageIds());\n''',
              'older stale callback guard')

          replace_once(
              '''                    Log.i(TAG, "Load more (newer): " + mChannelName);\n                    mIsLoadingMore = true;\n                    mConnection.getApiInstance().getMessageStorageApi().getMessages(mChannelName,\n''',
              '''                    Log.i(TAG, "Load more (newer): " + mChannelName);\n                    mIsLoadingMore = true;\n                    final int generation = mMessageWindowGeneration;\n                    mConnection.getApiInstance().getMessageStorageApi().getMessages(mChannelName,\n''',
              'newer generation capture')

          replace_once(
              '''                            (MessageList messages) -> {\n                                updateMessageList(() -> {\n                                    mAdapter.addMessagesToBottom(messages.getMessages(),\n                                            messages.getMessageIds());\n''',
              '''                            (MessageList messages) -> {\n                                updateMessageList(() -> {\n                                    if (generation != mMessageWindowGeneration)\n                                        return;\n                                    mAdapter.addMessagesToBottom(messages.getMessages(),\n                                            messages.getMessageIds());\n''',
              'newer stale callback guard')

          replace_once(
              '''        else\n            mMessageFilterOptions = null;\n        mUnreadCheckedFirst = -1;\n''',
              '''        else\n            mMessageFilterOptions = null;\n        final int generation = ++mMessageWindowGeneration;\n        // A full window reload supersedes any older/newer pagination still in flight.\n        mLoadOlderIdentifier = null;\n        mLoadNewerIdentifier = null;\n        mIsLoadingMore = false;\n        mUnreadCheckedFirst = -1;\n''',
              'reload invalidation')

          replace_once(
              '''        ResponseCallback<MessageList> cb = (MessageList messages) -> {\n            Log.i(TAG, "Got message list for " + mChannelName + ": " +\n''',
              '''        ResponseCallback<MessageList> cb = (MessageList messages) -> {\n            if (generation != mMessageWindowGeneration)\n                return;\n            Log.i(TAG, "Got message list for " + mChannelName + ": " +\n''',
              'reload callback guard')

          replace_once(
              '''            updateMessageList(() -> {\n                mAdapter.setMessages(messages.getMessages(), messages.getMessageIds());\n''',
              '''            updateMessageList(() -> {\n                if (generation != mMessageWindowGeneration)\n                    return;\n                mAdapter.setMessages(messages.getMessages(), messages.getMessageIds());\n''',
              'reload main-thread guard')

          replace_once(
              '''                mLoadOlderIdentifier = messages.getOlder();\n            });\n''',
              '''                mLoadOlderIdentifier = messages.getOlder();\n                mLoadNewerIdentifier = nearMessage == null ? null : messages.getNewer();\n                mIsLoadingMore = false;\n            });\n''',
              'reload paging state')

          replace_once(
              '''        if (nearMessage != null) {\n            storage.getMessagesNear(mChannelName, nearMessage,\n                    getFilterOptions(), (MessageList messages) -> {\n                        cb.onResponse(messages);\n                        updateMessageList(() -> {\n                            mLoadNewerIdentifier = messages.getNewer();\n                        });\n                    }, null);\n''',
              '''        if (nearMessage != null) {\n            storage.getMessagesNear(mChannelName, nearMessage,\n                    getFilterOptions(), cb, null);\n''',
              'near-message callback consolidation')

          path.write_text(text)

          test = Path('app/src/test/java/io/mrarm/irc/JumpToLatestStructureTest.java')
          test.write_text(r'''package io.mrarm.irc;

import org.junit.Test;

import java.io.IOException;
import java.nio.charset.StandardCharsets;
import java.nio.file.Files;
import java.nio.file.Path;
import java.nio.file.Paths;

import static org.junit.Assert.assertTrue;

/** Regression coverage for TIARCA-025 jump-to-latest pagination invalidation. */
public class JumpToLatestStructureTest {

    @Test
    public void fullReloadInvalidatesStalePaginationWindow() throws IOException {
        String source = readChatMessagesFragment();
        assertTrue(source.contains("final int generation = ++mMessageWindowGeneration;"));
        assertTrue(source.contains("mLoadOlderIdentifier = null;"));
        assertTrue(source.contains("mLoadNewerIdentifier = null;"));
        assertTrue(source.contains("generation != mMessageWindowGeneration"));
        assertTrue(source.contains(
                "mLoadNewerIdentifier = nearMessage == null ? null : messages.getNewer();"));
    }

    @Test
    public void jumpToLatestStillUsesFreshLatestWindowWhenNewerHistoryExists()
            throws IOException {
        String source = readChatMessagesFragment();
        assertTrue(source.contains(
                "if (mLoadNewerIdentifier != null)\\n            reloadMessages(null);"));
    }

    private static String readChatMessagesFragment() throws IOException {
        Path path = Paths.get(
                "app/src/main/java/io/mrarm/irc/chat/ChatMessagesFragment.java");
        if (!Files.exists(path))
            path = Paths.get(
                    "src/main/java/io/mrarm/irc/chat/ChatMessagesFragment.java");
        return new String(Files.readAllBytes(path), StandardCharsets.UTF_8);
    }
}
''')
          PY

          rm -f .github/workflows/tiarca-025-apply-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "TIARCA-025: stabilize jump to latest"
          git push origin HEAD:fix/tiarca-025-jump-to-latest
