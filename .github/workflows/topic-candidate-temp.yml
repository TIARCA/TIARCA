name: Build Editable Topic Candidate

on:
  push:
    branches:
      - candidate/editable-channel-topic

jobs:
  build-candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v5
        with:
          ref: 37c90dc9017eafa070033dceaffe1bc75c35a353

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks

      - name: Create keystore.properties
        shell: bash
        run: |
          cat > keystore.properties <<EOF2
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF2

      - name: Build signed candidate APK
        run: ./gradlew :app:assembleRelease

      - name: Name candidate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [[ -z "$APK" ]]; then
            echo "Candidate APK was not generated" >&2
            exit 1
          fi
          OUTPUT="app/build/outputs/apk/release/TIARCA-candidate-editable-topic-37c90dc.apk"
          cp "$APK" "$OUTPUT"
          echo "apk=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload candidate APK
        uses: actions/upload-artifact@v6
        with:
          name: TIARCA-candidate-editable-topic-37c90dc
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 14
