name: Publish TIARCA v0.9.1.3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-0913.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify version
        run: |
          grep -q 'versionCode 9013' app/build.gradle
          grep -q 'versionName "0.9.1.3"' app/build.gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Restore release keystore
        run: echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks
      - name: Create keystore properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF
      - name: Build signed APK
        run: ./gradlew :app:assembleRelease
      - name: Prepare assets and notes
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          cp "$APK" TIARCA-v0.9.1.3.apk
          sha256sum TIARCA-v0.9.1.3.apk > TIARCA-v0.9.1.3.apk.sha256
          awk '$0=="## v0.9.1.3"{f=1;next} f&&/^## v/{exit} f{print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git ls-remote --exit-code --tags origin refs/tags/v0.9.1.3 >/dev/null 2>&1; then
            git tag v0.9.1.3
            git push origin v0.9.1.3
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.9.1.3 >/dev/null 2>&1; then
            gh release upload v0.9.1.3 TIARCA-v0.9.1.3.apk TIARCA-v0.9.1.3.apk.sha256 --clobber
          else
            gh release create v0.9.1.3 TIARCA-v0.9.1.3.apk TIARCA-v0.9.1.3.apk.sha256 --title 'TIARCA v0.9.1.3' --notes-file release-notes.md
          fi
