name: Temporary MODE bold styling patch
on:
  push:
    branches: [test/monochrome-all-mode-events]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/monochrome-all-mode-events
      - name: Finalize bold actor and target styling
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/io/mrarm/irc/util/MessageBuilder.java')
          s=p.read_text()
          old='''        // Actor and affected nicknames remain clickable and are emphasized in bold.\n        for (ClickableSpan span : neutral.getSpans(0, neutral.length(), ClickableSpan.class)) {\n            int start = neutral.getSpanStart(span);\n            int end = neutral.getSpanEnd(span);\n            if (start >= 0 && end > start) {\n                neutral.setSpan(new StyleSpan(Typeface.BOLD), start, end,\n                        Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);\n            }\n        }\n        return neutral;'''
          new='''        return neutral;'''
          if old not in s: raise SystemExit('old neutralizer block missing')
          s=s.replace(old,new)
          needle='''    private CharSequence buildClickableColoredNick(String nick, NickClickSpanFactory clickSpanFactory) {'''
          helper='''    private CharSequence buildClickableBoldColoredNick(String nick,\n                                                       NickClickSpanFactory clickSpanFactory) {\n        CharSequence nickText = buildClickableColoredNick(nick, clickSpanFactory);\n        SpannableString boldNick = new SpannableString(nickText);\n        if (nick != null && !nick.isEmpty()) {\n            boldNick.setSpan(new StyleSpan(Typeface.BOLD), 0, nick.length(),\n                    Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);\n        }\n        return boldNick;\n    }\n\n'''
          if helper not in s:
              if needle not in s: raise SystemExit('helper insertion point missing')
              s=s.replace(needle, helper+needle)
          # Only MODE construction: actor plus affected nick targets.
          start=s.index('    private CharSequence buildModeMessage(')
          end=s.index('    private CharSequence makeModeEventNeutral(', start)
          mode=s[start:end]
          mode=mode.replace('buildClickableColoredNick(entry.getKey(), clickSpanFactory)', 'buildClickableBoldColoredNick(entry.getKey(), clickSpanFactory)')
          mode=mode.replace('buildClickableColoredNick(senderNick, clickSpanFactory)', 'buildClickableBoldColoredNick(senderNick, clickSpanFactory)')
          s=s[:start]+mode+s[end:]
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/mrarm/irc/util/MessageBuilder.java
          git diff --cached --quiet && exit 0
          git commit -m "Bold MODE actors and affected nicknames"
          git push origin HEAD:test/monochrome-all-mode-events
