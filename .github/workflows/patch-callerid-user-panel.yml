name: Patch caller-id user panel

on:
  push:
    branches:
      - fix/callerid-accept-user-panel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/callerid-accept-user-panel
      - name: Patch user panel private-message path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/mrarm/irc/dialog/UserBottomSheetDialog.java')
          s = p.read_text()
          old = '''        view.findViewById(R.id.message_button).setOnClickListener((View v) -> {\n            List<String> l = new ArrayList<>();\n            l.add(mNick);\n            mConnection.getApiInstance().joinChannels(l, (Void vo) -> {\n'''
          new = '''        view.findViewById(R.id.message_button).setOnClickListener((View v) -> {\n            io.mrarm.irc.irc.CallerIdAcceptManager.acceptForVoluntaryPrivateChat(mConnection, mNick);\n            List<String> l = new ArrayList<>();\n            l.add(mNick);\n            mConnection.getApiInstance().joinChannels(l, (Void vo) -> {\n'''
          if old not in s:
              raise SystemExit('expected message_button block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove temporary workflow and commit patch
        run: |
          git rm .github/workflows/patch-callerid-user-panel.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/mrarm/irc/dialog/UserBottomSheetDialog.java
          git commit -m "Send ACCEPT from user panel private-message action"
          git push origin HEAD:fix/callerid-accept-user-panel
