name: Create v0.9.1 tag

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/create-v0.9.1-tag.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create v0.9.1 tag if missing
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.9.1 >/dev/null 2>&1; then
            echo "v0.9.1 already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.9.1 "${GITHUB_SHA}" -m "TIARCA v0.9.1"
          git push origin refs/tags/v0.9.1
