name: Publish TIARCA 0.9.1.5

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f13215e8e1378728ee31bdb2960f907be85e01c6
          fetch-depth: 0
      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f13215e8e1378728ee31bdb2960f907be85e01c6"
          grep -q 'versionCode 9015' app/build.gradle
          grep -q 'versionName "0.9.1.5"' app/build.gradle
          grep -q '^## v0.9.1.5$' CHANGELOG.md
          git fetch --tags origin
          test "$(git rev-list -n1 v0.9.1.5)" = "f13215e8e1378728ee31bdb2960f907be85e01c6"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Restore release keystore
        shell: bash
        run: echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks
      - name: Create keystore.properties
        shell: bash
        run: |
          cat > keystore.properties <<EOF
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF
      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease
      - name: Name APK, checksum and release notes
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          cp "$APK" TIARCA-v0.9.1.5.apk
          sha256sum TIARCA-v0.9.1.5.apk > TIARCA-v0.9.1.5.apk.sha256
          awk '$0 == "## v0.9.1.5" {f=1; next} f && /^## v/ {exit} f {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.9.1.5 >/dev/null 2>&1; then
            gh release upload v0.9.1.5 TIARCA-v0.9.1.5.apk TIARCA-v0.9.1.5.apk.sha256 --clobber
            gh release edit v0.9.1.5 --title 'TIARCA v0.9.1.5' --notes-file release-notes.md --draft=false --prerelease=false
          else
            gh release create v0.9.1.5 TIARCA-v0.9.1.5.apk TIARCA-v0.9.1.5.apk.sha256 --title 'TIARCA v0.9.1.5' --notes-file release-notes.md
          fi
