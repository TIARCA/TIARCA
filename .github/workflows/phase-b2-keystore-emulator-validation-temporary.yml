name: Validate B2 Android Keystore TLS handshakes (temporary)

on:
  push:
    branches:
      - validation/b2-keystore-emulator

permissions:
  contents: read

jobs:
  keystore-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35]
    steps:
      - name: Checkout B2 source
        uses: actions/checkout@v5
        with:
          ref: 577be2de8b89d15bc6ec10965eb1db317b02e64a
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM for Android emulator
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Run native Keystore and mutual TLS integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew --no-daemon :app:connectedStandardDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.mrarm.irc.KeystoreClientCertificateInstrumentedTest
