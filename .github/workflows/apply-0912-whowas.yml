name: Apply TIARCA 0.9.1.2 WHOWAS implementation

on:
  push:
    paths:
      - '.github/workflows/apply-0912-whowas.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/0.9.1.2-whowas-records
          fetch-depth: 0
      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          # Let the existing WHOIS handler forward orphan 312 replies to the WHOWAS collector.
          p = Path('chatlib/src/main/java/io/mrarm/chatlib/irc/handlers/WhoisCommandHandler.java')
          s = p.read_text()
          s = s.replace('    private final Map<String, WhoisInfo.Builder> currentReply = new HashMap<>();\n', '''    public interface OrphanServerReplyListener {\n        void onOrphanServerReply(List<String> params);\n    }\n\n    private final Map<String, WhoisInfo.Builder> currentReply = new HashMap<>();\n    private volatile OrphanServerReplyListener orphanServerReplyListener;\n\n    public void setOrphanServerReplyListener(OrphanServerReplyListener listener) {\n        orphanServerReplyListener = listener;\n    }\n''')
          s = s.replace('''            } else if (numeric == RPL_WHOISSERVER) {\n                // Numeric 312 is shared by WHOIS and WHOWAS. During a WHOWAS lookup it may\n                // legitimately arrive without a preceding WHOIS 311. Consume it here instead\n                // of reporting it as malformed WHOIS and leaking the raw protocol line to the\n                // server-status view. The dedicated WHOWAS collector owns the surrounding\n                // 314/369 sequence.\n                return;\n''', '''            } else if (numeric == RPL_WHOISSERVER) {\n                // Numeric 312 is shared by WHOIS and WHOWAS. If there is no active WHOIS\n                // builder, give the WHOWAS collector first access to the server/time tuple.\n                OrphanServerReplyListener listener = orphanServerReplyListener;\n                if (listener != null)\n                    listener.onOrphanServerReply(params);\n                return;\n''')
          p.write_text(s)

          Path('app/src/main/java/io/mrarm/irc/irc/WhowasCommandHandler.java').write_text(r'''package io.mrarm.irc.irc;

import java.text.ParseException;
import java.text.SimpleDateFormat;
import java.util.ArrayList;
import java.util.Date;
import java.util.HashMap;
import java.util.List;
import java.util.Locale;
import java.util.Map;

import io.mrarm.chatlib.irc.CommandHandler;
import io.mrarm.chatlib.irc.InvalidMessageException;
import io.mrarm.chatlib.irc.MessagePrefix;
import io.mrarm.chatlib.irc.ServerConnectionData;
import io.mrarm.chatlib.irc.handlers.WhoisCommandHandler;

/** Collects complete WHOWAS batches, including the shared 312 server/time reply. */
public class WhowasCommandHandler implements CommandHandler {

    public interface Callback {
        void onResult(List<Result> results);
        void onError(String message);
    }

    public static class Result {
        public final String nick;
        public final String user;
        public final String host;
        public final String realName;
        public String server;
        public String serverInfo;
        public Date disconnectTime;

        Result(String nick, String user, String host, String realName) {
            this.nick = nick;
            this.user = user;
            this.host = host;
            this.realName = realName;
        }
    }

    private static class RequestState {
        final Callback callback;
        final List<Result> results = new ArrayList<>();
        RequestState(Callback callback) { this.callback = callback; }
    }

    private static final int RPL_WHOWASUSER = 314;
    private static final int RPL_ENDOFWHOWAS = 369;
    private static final int ERR_WASNOSUCHNICK = 406;
    private final Map<String, RequestState> requests = new HashMap<>();

    public static WhowasCommandHandler getOrInstall(ServerConnectionData data) {
        WhowasCommandHandler handler = data.getCommandHandlerList().getHandler(WhowasCommandHandler.class);
        if (handler == null) {
            handler = new WhowasCommandHandler();
            data.getCommandHandlerList().registerHandler(handler);
        }
        WhoisCommandHandler whois = data.getCommandHandlerList().getHandler(WhoisCommandHandler.class);
        if (whois != null)
            whois.setOrphanServerReplyListener(handler::handleOrphanServerReply);
        return handler;
    }

    public synchronized void request(String nick, Callback callback) {
        requests.put(key(nick), new RequestState(callback));
    }

    @Override
    public Object[] getHandledCommands() {
        return new Object[] { RPL_WHOWASUSER, RPL_ENDOFWHOWAS, ERR_WASNOSUCHNICK };
    }

    @Override
    public synchronized void handle(ServerConnectionData connection, MessagePrefix sender,
                                    String command, List<String> params, Map<String, String> tags)
            throws InvalidMessageException {
        int numeric = CommandHandler.toNumeric(command);
        String nick = CommandHandler.getParamWithCheck(params, 1);
        String key = key(nick);
        RequestState state = requests.get(key);
        if (state == null)
            return;
        if (numeric == RPL_WHOWASUSER) {
            state.results.add(new Result(nick,
                    CommandHandler.getParamWithCheck(params, 2),
                    CommandHandler.getParamWithCheck(params, 3),
                    CommandHandler.getParamOrNull(params, 5)));
        } else if (numeric == RPL_ENDOFWHOWAS) {
            requests.remove(key);
            if (!state.results.isEmpty())
                state.callback.onResult(new ArrayList<>(state.results));
            else
                state.callback.onError("WHOWAS data unavailable");
        } else if (numeric == ERR_WASNOSUCHNICK) {
            requests.remove(key);
            state.callback.onError(CommandHandler.getParamOrDefault(params, 2,
                    "WHOWAS data unavailable"));
        }
    }

    /** Called by WhoisCommandHandler for numeric 312 when there is no active WHOIS reply. */
    public synchronized void handleOrphanServerReply(List<String> params) {
        if (params.size() < 3)
            return;
        String key = key(params.get(1));
        RequestState state = requests.get(key);
        if (state == null || state.results.isEmpty())
            return;
        Result result = state.results.get(state.results.size() - 1);
        result.server = params.get(2);
        String info = params.size() > 3 ? params.get(3) : null;
        Date time = parseDisconnectTime(info);
        if (time != null)
            result.disconnectTime = time;
        else
            result.serverInfo = info;
    }

    static Date parseDisconnectTime(String value) {
        if (value == null || value.trim().isEmpty())
            return null;
        String input = value.trim();
        if (input.matches("[0-9]{10}")) {
            try { return new Date(Long.parseLong(input) * 1000L); }
            catch (NumberFormatException ignored) { return null; }
        }
        String[] patterns = {
                "EEE MMM dd yyyy HH:mm:ss",
                "EEE MMM dd HH:mm:ss yyyy",
                "EEE MMM d yyyy HH:mm:ss",
                "EEE MMM d HH:mm:ss yyyy"
        };
        for (String pattern : patterns) {
            SimpleDateFormat parser = new SimpleDateFormat(pattern, Locale.US);
            parser.setLenient(false);
            try { return parser.parse(input); }
            catch (ParseException ignored) { }
        }
        return null;
    }

    private static String key(String nick) {
        return nick.toLowerCase(Locale.ROOT);
    }
}
''')

          Path('app/src/main/java/io/mrarm/irc/irc/WhowasStatusMessageInfo.java').write_text(r'''package io.mrarm.irc.irc;

import java.util.Date;

import io.mrarm.chatlib.dto.StatusMessageInfo;

/** Structured WHOWAS record rendered specially in the Server tab. */
public class WhowasStatusMessageInfo extends StatusMessageInfo {
    private final WhowasCommandHandler.Result result;

    public WhowasStatusMessageInfo(WhowasCommandHandler.Result result) {
        super(null, new Date(), MessageType.NOTICE, "WHOWAS " + result.nick);
        this.result = result;
    }

    public WhowasCommandHandler.Result getResult() {
        return result;
    }
}
''')

          Path('app/src/main/java/io/mrarm/irc/dialog/WhowasQueryDialog.java').write_text(r'''package io.mrarm.irc.dialog;

import android.content.Context;
import android.widget.EditText;
import android.widget.Toast;

import androidx.appcompat.app.AlertDialog;

import java.util.List;

import io.mrarm.chatlib.irc.IRCConnection;
import io.mrarm.chatlib.irc.ServerConnectionData;
import io.mrarm.irc.MainActivity;
import io.mrarm.irc.R;
import io.mrarm.irc.ServerConnectionInfo;
import io.mrarm.irc.irc.WhowasCommandHandler;
import io.mrarm.irc.irc.WhowasStatusMessageInfo;

/** Entry point for manual WHOWAS queries from the Server-tab overflow menu. */
public final class WhowasQueryDialog {
    private WhowasQueryDialog() { }

    public static void show(Context context, ServerConnectionInfo connection) {
        if (context == null || connection == null ||
                !(connection.getApiInstance() instanceof IRCConnection))
            return;
        EditText input = new EditText(context);
        input.setSingleLine(true);
        input.setHint(R.string.whowas_nickname_prompt);
        AlertDialog dialog = new AlertDialog.Builder(context)
                .setTitle(R.string.action_whowas)
                .setView(input)
                .setNegativeButton(R.string.action_cancel, null)
                .setPositiveButton(R.string.action_ok, null)
                .create();
        dialog.setOnShowListener(ignored -> dialog.getButton(AlertDialog.BUTTON_POSITIVE)
                .setOnClickListener(v -> {
                    String nick = input.getText().toString().trim();
                    if (nick.isEmpty() || nick.matches(".*[\\s\\r\\n].*")) {
                        input.setError(context.getString(R.string.whowas_nickname_prompt));
                        return;
                    }
                    query(context, connection, nick);
                    dialog.dismiss();
                }));
        dialog.show();
        if (context instanceof MainActivity)
            ((MainActivity) context).setFragmentDialog(dialog);
    }

    private static void query(Context context, ServerConnectionInfo connection, String nick) {
        IRCConnection irc = (IRCConnection) connection.getApiInstance();
        ServerConnectionData data = irc.getServerConnectionData();
        WhowasCommandHandler handler = WhowasCommandHandler.getOrInstall(data);
        handler.request(nick, new WhowasCommandHandler.Callback() {
            @Override public void onResult(List<WhowasCommandHandler.Result> results) {
                android.os.Handler main = new android.os.Handler(android.os.Looper.getMainLooper());
                main.post(() -> {
                    for (WhowasCommandHandler.Result result : results)
                        data.getServerStatusData().addMessage(new WhowasStatusMessageInfo(result));
                });
            }
            @Override public void onError(String message) {
                new android.os.Handler(android.os.Looper.getMainLooper()).post(() ->
                        Toast.makeText(context, message, Toast.LENGTH_LONG).show());
            }
        });
        irc.sendCommandRaw("WHOWAS " + nick, null, null);
    }
}
''')

          Path('app/src/main/java/io/mrarm/irc/view/WhowasRecordView.java').write_text(r'''package io.mrarm.irc.view;

import android.content.ClipData;
import android.content.ClipboardManager;
import android.content.Context;
import android.graphics.Typeface;
import android.text.format.DateFormat;
