name: Apply TIARCA 0.9.1.2 WHOWAS implementation

on:
  push:
    branches:
      - feature/0.9.1.2-whowas-records
    paths:
      - '.github/workflows/apply-0912-whowas.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/0.9.1.2-whowas-records
          fetch-depth: 0
      - name: Recover and run implementation script
        shell: bash
        run: |
          set -euo pipefail
          git show 6a796d387ba177789b7cce15b787e52c49d5dd5e:.github/workflows/apply-0912-whowas.yml \
            | sed -n "/python3 <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/apply_0912.py
          python3 /tmp/apply_0912.py
          git config user.name 'TIARCA'
          git config user.email 'marcovange@duck.com'
          git add -A
          git commit -m 'Implement structured WHOWAS records for TIARCA 0.9.1.2'
          git push origin HEAD:feature/0.9.1.2-whowas-records
