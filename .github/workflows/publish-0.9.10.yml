name: Finalize TIARCA 0.9.10 release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-0.9.10.yml']

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Correct F-Droid asset naming and verify the published release
        uses: actions/github-script@v8
        with:
          script: |
            const tag = 'v0.9.10';
            const { data: ref } = await github.rest.git.getRef({
              ...context.repo, ref: `tags/${tag}`
            });
            if (ref.object.sha !== 'b42c2fadb7e9bbe3a56ae4d8c947f13235f387bb')
              throw new Error('Release source tag changed');
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              ...context.repo, run_id: 41350836125, per_page: 100
            });
            const build = jobs.jobs.find(job => job.name === 'build-release');
            for (const name of ['Verify signing certificates', 'Verify distribution APKs']) {
              if (!build || !build.steps.some(step => step.name === name && step.conclusion === 'success'))
                throw new Error(`Required APK verification did not pass: ${name}`);
            }
            let { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag
            });
            const standardName = `TIARCA-${tag}.apk`;
            const oldName = `TIARCA-fdroid-${tag}.apk`;
            const newName = `TIARCA-${tag}_fdroid.apk`;
            const standard = release.assets.find(asset => asset.name === standardName);
            const fdroid = release.assets.find(asset => asset.name === oldName || asset.name === newName);
            const standardDigest = 'f88e0d58ac40f02cc397a66631533d93708b1d1b75bbe29c7426b66b211fa6dd';
            const fdroidDigest = 'd5cdd38b2d05df68b49267d0964acbb195f7dc1e4591ae4e3f698ce6851dba1f';
            if (!standard || standard.digest !== `sha256:${standardDigest}` ||
                !fdroid || fdroid.digest !== `sha256:${fdroidDigest}`)
              throw new Error('Published APK digests differ from the signed verified build');
            if (fdroid.name !== newName) {
              await github.rest.repos.updateReleaseAsset({
                ...context.repo, asset_id: fdroid.id, name: newName
              });
            }
            const checksum = Buffer.from(`${fdroidDigest}  ${newName}\n`, 'utf8');
            const expectedChecksumDigest = 'sha256:' + require('crypto')
              .createHash('sha256').update(checksum).digest('hex');
            let checksumAsset = release.assets.find(asset => asset.name === newName + '.sha256');
            if (!checksumAsset) {
              const uploaded = await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name: newName + '.sha256',
                data: checksum,
                headers: { 'content-type': 'application/octet-stream', 'content-length': checksum.length }
              });
              checksumAsset = uploaded.data;
            }
            if (checksumAsset.digest !== expectedChecksumDigest)
              throw new Error('F-Droid checksum upload did not match expected content');
            const oldChecksum = release.assets.find(asset => asset.name === oldName + '.sha256');
            if (oldChecksum) {
              await github.rest.repos.deleteReleaseAsset({
                ...context.repo, asset_id: oldChecksum.id
              });
            }
            ({ data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }));
            for (const name of [standardName, standardName + '.sha256', newName, newName + '.sha256']) {
              if (!release.assets.some(asset => asset.name === name && asset.size > 0))
                throw new Error(`Missing release asset: ${name}`);
            }
            const firstApk = release.assets.find(asset => asset.name.endsWith('.apk'));
            if (!firstApk || firstApk.name !== standardName)
              throw new Error('Legacy updater would not receive the standard APK first');
            core.info(`Published release verified: ${release.html_url}`);
