name: Publish TIARCA 0.9.1.8b

on:
  push:
    paths:
      - '.github/workflows/publish-0918b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v5
        with:
          ref: 613070aa1e008a2b359686d56d1a2c2149142d60
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks

      - name: Create keystore.properties
        shell: bash
        run: |
          cat > keystore.properties <<EOF
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF

      - name: Verify release metadata
        run: |
          grep -q 'versionCode 90182' app/build.gradle
          grep -q 'versionName "0.9.1.8b"' app/build.gradle
          grep -q '^## v0.9.1.8b' CHANGELOG.md

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Prepare assets
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$APK" TIARCA-v0.9.1.8b.apk
          sha256sum TIARCA-v0.9.1.8b.apk > TIARCA-v0.9.1.8b.apk.sha256
          awk '/^## v0.9.1.8b/{flag=1;next}/^## v/{if(flag)exit}flag' CHANGELOG.md > release-notes.md

      - name: Publish exact tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f v0.9.1.8b 613070aa1e008a2b359686d56d1a2c2149142d60
          git push origin refs/tags/v0.9.1.8b --force
          gh release create v0.9.1.8b TIARCA-v0.9.1.8b.apk TIARCA-v0.9.1.8b.apk.sha256 --title 'TIARCA v0.9.1.8b' --notes-file release-notes.md --latest

      - name: Remove temporary publisher
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cleanup
          cd cleanup
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --ff-only origin main
          if [ -f .github/workflows/publish-0918b.yml ]; then
            git rm -f .github/workflows/publish-0918b.yml
            git commit -m 'Remove temporary 0.9.1.8b publisher'
            git push origin main
          fi
