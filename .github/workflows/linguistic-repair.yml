name: Linguistic translation repair

on:
  push:
    branches:
      - translations/sync-locales-14482738850864919158
    paths:
      - tools/linguistic_repair.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: translations/sync-locales-14482738850864919158
      - name: Apply reviewed translations
        run: python3 tools/linguistic_repair.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/values-*/strings.xml
          git commit -m "Repair reviewed translations"
          git push
