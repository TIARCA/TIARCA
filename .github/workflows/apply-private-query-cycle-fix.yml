name: Apply private query nick-cycle fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-private-query-cycle-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/private-query-nick-cycle
          fetch-depth: 0
      - name: Wire normalized alias handling into private query rename
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app/src/main/java/io/mrarm/irc/ServerConnectionInfo.java')
          s = p.read_text()
          pattern = re.compile(r'(?ms)(        synchronized \(this\) \{\n)            mQueryNickAliases\.put\(oldNick\.toLowerCase\(Locale\.ROOT\), newNick\);\n            // Preserve a chain when a user changes nick more than once in one connection\.\n            for \(Map\.Entry<String, String> alias : mQueryNickAliases\.entrySet\(\)\) \{\n                if \(alias\.getValue\(\)\.equalsIgnoreCase\(oldNick\)\)\n                    alias\.setValue\(newNick\);\n            \}\n        \}')
          replacement = '        synchronized (this) {\n            PrivateConversationAliases.recordNickChange(mQueryNickAliases, oldNick, newNick);\n        }'
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Expected one alias block, replaced {count}')
          p.write_text(s2)
      - name: Commit fix branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/mrarm/irc/ServerConnectionInfo.java
          git commit -m 'Normalize private query aliases on nick changes'
          git push origin HEAD:fix/private-query-nick-cycle
      - name: Remove temporary workflow from main
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/apply-private-query-cycle-fix.yml
          git commit -m 'Remove temporary private query fix workflow'
          git push origin main
