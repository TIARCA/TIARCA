name: Dispatch TIARCA v0.9.1.2 release

on:
  push:
    paths:
      - '.github/workflows/dispatch-release-0.9.1.2.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release workflow on v0.9.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches \
            -d '{"ref":"v0.9.1.2"}'
