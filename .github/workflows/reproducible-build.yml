name: Verify Reproducible Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reproducible-build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Checkout build A
        uses: actions/checkout@v5
        with:
          path: build-a
          fetch-depth: 1

      - name: Checkout build B
        uses: actions/checkout@v5
        with:
          path: build-b
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare deterministic environment
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build-a/gradlew build-b/gradlew
          SOURCE_DATE_EPOCH=$(git -C build-a show -s --format=%ct HEAD)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          echo "Source commit: $(git -C build-a rev-parse HEAD)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"

      - name: Build unsigned release A
        working-directory: build-a
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-a
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleRelease

      - name: Build unsigned release B
        working-directory: build-b
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-b
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleRelease

      - name: Compare APKs
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          APK_A=$(find build-a/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
          APK_B=$(find build-b/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)

          if [[ -z "$APK_A" || -z "$APK_B" ]]; then
            echo "Release APK missing" >&2
            exit 1
          fi

          echo "Build A:"
          sha256sum "$APK_A"
          echo "Build B:"
          sha256sum "$APK_B"

          if cmp -s "$APK_A" "$APK_B"; then
            echo "result=identical" >> "$GITHUB_OUTPUT"
            echo "SUCCESS: independently built release APKs are byte-for-byte identical."
          else
            echo "result=different" >> "$GITHUB_OUTPUT"
            echo "ERROR: independently built release APKs differ." >&2

            mkdir -p reproducibility-diff/a reproducibility-diff/b
            unzip -qq "$APK_A" -d reproducibility-diff/a
            unzip -qq "$APK_B" -d reproducibility-diff/b
            diff -ru reproducibility-diff/a reproducibility-diff/b > reproducibility-diff/unzipped.diff || true
            cp "$APK_A" reproducibility-diff/build-a.apk
            cp "$APK_B" reproducibility-diff/build-b.apk
            exit 1
          fi

      - name: Upload mismatch diagnostics
        if: failure() && steps.compare.outputs.result == 'different'
        uses: actions/upload-artifact@v6
        with:
          name: reproducibility-diagnostics
          path: reproducibility-diff/
          if-no-files-found: ignore
