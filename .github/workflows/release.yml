name: Build TIARCA Release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: tiarca-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish_release: ${{ steps.version.outputs.publish_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -n 1)
          if [[ -z "$VERSION" ]]; then
            echo "Unable to read versionName from app/build.gradle" >&2
            exit 1
          fi

          TAG="v$VERSION"
          PUBLISH_RELEASE=false

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$TAG" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION" >&2
              exit 1
            fi
            PUBLISH_RELEASE=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"

  build-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.publish_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks

      - name: Create keystore.properties
        shell: bash
        run: |
          cat > keystore.properties <<EOF
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Name and checksum release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [[ -z "$APK" ]]; then
            echo "Release APK was not generated" >&2
            exit 1
          fi
          OUTPUT="app/build/outputs/apk/release/TIARCA-${{ needs.prepare-release.outputs.tag }}.apk"
          CHECKSUM="${OUTPUT}.sha256"
          cp "$APK" "$OUTPUT"
          (cd "$(dirname "$OUTPUT")" && sha256sum "$(basename "$OUTPUT")") > "$CHECKSUM"
          echo "apk=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Generated APK: $OUTPUT"
          echo "Generated checksum: $CHECKSUM"

      - name: Prepare release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.prepare-release.outputs.version }}'
          CURRENT_TAG='${{ needs.prepare-release.outputs.tag }}'

          awk -v header="## v${VERSION}" '
            $0 == header { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "Unable to extract release notes for v${VERSION} from CHANGELOG.md" >&2
            exit 1
          fi

          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            printf '\n**Full Changelog**: https://github.com/TIARCA/TIARCA/compare/%s...%s\n' \
              "$PREVIOUS_TAG" "$CURRENT_TAG" >> release-notes.md
          fi

      - name: Upload release files as artifact
        uses: actions/upload-artifact@v6
        with:
          name: TIARCA-release
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.checksum }}

      - name: Create GitHub Release
        if: needs.prepare-release.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: TIARCA v${{ needs.prepare-release.outputs.version }}
          files: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.checksum }}
          body_path: release-notes.md
