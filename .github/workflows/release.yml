name: Build TIARCA Release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: tiarca-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish_release: ${{ steps.version.outputs.publish_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -n 1)
          if [[ -z "$VERSION" ]]; then
            echo "Unable to read versionName from app/build.gradle" >&2
            exit 1
          fi

          TAG="v$VERSION"
          PUBLISH_RELEASE=false

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$TAG" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION" >&2
              exit 1
            fi
            PUBLISH_RELEASE=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Verify release home is synchronized
        run: python3 tools/sync_release_home.py --check

  verify-reproducible:
    needs: prepare-release
    if: needs.prepare-release.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Checkout build A
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: build-a
          fetch-depth: 1

      - name: Checkout build B
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: build-b
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare deterministic environment
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build-a/gradlew build-b/gradlew
          SOURCE_DATE_EPOCH=$(git -C build-a show -s --format=%ct HEAD)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          echo "Source commit: $(git -C build-a rev-parse HEAD)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"

      - name: Build unsigned release A
        working-directory: build-a
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-a
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Build unsigned release B
        working-directory: build-b
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-b
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Compare APKs
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          for FLAVOR in standard fdroid; do
          APK_A=$(find "build-a/app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
          APK_B=$(find "build-b/app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)

          if [[ -z "$APK_A" || -z "$APK_B" ]]; then
            echo "Release APK missing" >&2
            exit 1
          fi

          echo "Build A:"
          sha256sum "$APK_A"
          echo "Build B:"
          sha256sum "$APK_B"

          if cmp -s "$APK_A" "$APK_B"; then
            echo "result=identical" >> "$GITHUB_OUTPUT"
            echo "SUCCESS: independently built release APKs are byte-for-byte identical."
          else
            echo "result=different" >> "$GITHUB_OUTPUT"
            echo "ERROR: independently built release APKs differ." >&2

            mkdir -p reproducibility-diff/$FLAVOR/a reproducibility-diff/$FLAVOR/b
            unzip -qq "$APK_A" -d reproducibility-diff/$FLAVOR/a
            unzip -qq "$APK_B" -d reproducibility-diff/$FLAVOR/b
            diff -ru reproducibility-diff/$FLAVOR/a reproducibility-diff/$FLAVOR/b > reproducibility-diff/$FLAVOR/unzipped.diff || true
            cp "$APK_A" reproducibility-diff/$FLAVOR/build-a.apk
            cp "$APK_B" reproducibility-diff/$FLAVOR/build-b.apk
            exit 1
          fi
          done

      - name: Upload mismatch diagnostics
        if: failure() && steps.compare.outputs.result == 'different'
        uses: actions/upload-artifact@v6
        with:
          name: reproducibility-diagnostics
          path: reproducibility-diff/
          if-no-files-found: ignore

  build-release:
    needs:
      - prepare-release
      - verify-reproducible
    if: ${{ always() && needs.prepare-release.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.verify-reproducible.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks

      - name: Create keystore.properties
        shell: bash
        run: |
          cat > keystore.properties <<EOF
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Verify distribution APKs
        run: |
          python3 tools/verify_distribution_apk.py Standard
          python3 tools/verify_distribution_apk.py Fdroid

      - name: Name and checksum release APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-apks
          for FLAVOR in standard fdroid; do
            APK=$(find "app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name "*.apk" | head -n 1)
            test -n "$APK"
            if [[ "$FLAVOR" == standard ]]; then
              NAME="TIARCA-${{ needs.prepare-release.outputs.tag }}.apk"
            else
              NAME="TIARCA-fdroid-${{ needs.prepare-release.outputs.tag }}.apk"
            fi
            cp "$APK" "release-apks/$NAME"
            (cd release-apks && sha256sum "$NAME") > "release-apks/$NAME.sha256"
          done

      - name: Prepare release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.prepare-release.outputs.version }}'
          CURRENT_TAG='${{ needs.prepare-release.outputs.tag }}'

          awk -v header="## v${VERSION}" '
            $0 == header { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "Unable to extract release notes for v${VERSION} from CHANGELOG.md" >&2
            exit 1
          fi

          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            printf '\n**Full Changelog**: https://github.com/TIARCA/TIARCA/compare/%s...%s\n' \
              "$PREVIOUS_TAG" "$CURRENT_TAG" >> release-notes.md
          fi

      - name: Upload release files as artifact
        uses: actions/upload-artifact@v6
        with:
          name: TIARCA-release
          path: |
            release-apks/*.apk
            release-apks/*.sha256

      - name: Create GitHub Release
        if: needs.prepare-release.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: TIARCA v${{ needs.prepare-release.outputs.version }}
          files: |
            release-apks/*.apk
            release-apks/*.sha256
          body_path: release-notes.md
