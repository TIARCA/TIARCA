name: Build TIARCA Release

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: tiarca-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish_release: ${{ steps.version.outputs.publish_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version and publish a missing tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -n 1)
          if [[ -z "$VERSION" ]]; then
            echo "Unable to read versionName from app/build.gradle" >&2
            exit 1
          fi

          TAG="v$VERSION"
          PUBLISH_RELEASE=false

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$TAG" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION" >&2
              exit 1
            fi
            PUBLISH_RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists; no release will be created."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" "$GITHUB_SHA" -m "TIARCA $TAG"
              if git push origin "refs/tags/$TAG"; then
                PUBLISH_RELEASE=true
              elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
                echo "Tag $TAG was created concurrently; no duplicate release will be created."
              else
                exit 1
              fi
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"

  build-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.publish_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks

      - name: Create keystore.properties
        shell: bash
        run: |
          cat > keystore.properties <<EOF
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Name release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [[ -z "$APK" ]]; then
            echo "Release APK was not generated" >&2
            exit 1
          fi
          OUTPUT="app/build/outputs/apk/release/TIARCA-${{ needs.prepare-release.outputs.tag }}.apk"
          cp "$APK" "$OUTPUT"
          echo "apk=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "Generated APK: $OUTPUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TIARCA-release
          path: ${{ steps.apk.outputs.apk }}

      - name: Create GitHub Release
        if: needs.prepare-release.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: TIARCA v${{ needs.prepare-release.outputs.version }}
          files: ${{ steps.apk.outputs.apk }}
          generate_release_notes: true
