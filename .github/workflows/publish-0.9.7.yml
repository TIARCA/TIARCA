name: Temporary publish TIARCA 0.9.7

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-0.9.7.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: be2e6f79bed4b146cd43d3dcf0b35573ef5defe6
      VERSION: 0.9.7
      VERSION_CODE: "90700"
      TAG: v0.9.7
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout exact release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -n 1)
          ACTUAL_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n 1)
          test "$ACTUAL_VERSION" = "$VERSION"
          test "$ACTUAL_CODE" = "$VERSION_CODE"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks

      - name: Create keystore.properties
        shell: bash
        run: |
          cat > keystore.properties <<EOF
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Name APK and generate checksum
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          BUILT=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$BUILT"
          OUT="app/build/outputs/apk/release/TIARCA-${TAG}.apk"
          SUM="${OUT}.sha256"
          cp "$BUILT" "$OUT"
          (cd "$(dirname "$OUT")" && sha256sum "$(basename "$OUT")") > "$SUM"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "checksum=$SUM" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          awk -v header="## v${VERSION}" '
            $0 == header { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n 1 || true)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            printf '\n**Full Changelog**: https://github.com/TIARCA/TIARCA/compare/%s...%s\n' "$PREVIOUS_TAG" "$TAG" >> release-notes.md
          fi

      - name: Create or verify tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TARGET=$(git rev-list -n 1 "$TAG")
            test "$TARGET" = "$SOURCE_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$SOURCE_SHA" -m "TIARCA ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" "${{ steps.apk.outputs.apk }}" "${{ steps.apk.outputs.checksum }}" \
            --title "TIARCA v${VERSION}" --notes-file release-notes.md --verify-tag

      - name: Cleanup temporary publisher
        if: always()
        shell: bash
        run: |
          set +e
          git reset --hard
          git clean -fdx
          git fetch origin main
          git checkout -B cleanup origin/main
          if [[ -f .github/workflows/publish-0.9.7.yml ]]; then
            git rm .github/workflows/publish-0.9.7.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove temporary 0.9.7 publisher"
            git push origin HEAD:main
          fi
