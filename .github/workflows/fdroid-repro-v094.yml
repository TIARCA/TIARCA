name: Test F-Droid Reproducibility v0.9.4

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fdroid-repro-v094.yml'

permissions:
  contents: read

jobs:
  verify-upstream-apk:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v5

      - name: Checkout exact v0.9.4 source
        uses: actions/checkout@v5
        with:
          ref: v0.9.4
          path: source
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages apksigcopier
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"
          echo "Using Android build-tools: $(basename "$BUILD_TOOLS")"

      - name: Download official signed v0.9.4 APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o official.apk \
            https://github.com/TIARCA/TIARCA/releases/download/v0.9.4/TIARCA-v0.9.4.apk
          echo 'Official release APK:'
          sha256sum official.apk
          test "$(sha256sum official.apk | awk '{print $1}')" = 'bfdb6dfb9dcdc56f995f961c0e9426bf13ff96802be337b7ceda1d81e1a6226e'

      - name: Build unsigned APK from exact tag
        working-directory: source
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-v094
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          rm -f keystore.properties
          ./gradlew --no-daemon --no-build-cache clean :app:assembleRelease

      - name: Locate unsigned APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED=$(find source/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
          test -n "$UNSIGNED"
          cp "$UNSIGNED" rebuilt-unsigned.apk
          echo 'Rebuilt unsigned APK:'
          sha256sum rebuilt-unsigned.apk

      - name: Test 1 - compare official APK with independent unsigned rebuild
        shell: bash
        run: |
          set -euo pipefail
          apksigcopier compare official.apk --unsigned rebuilt-unsigned.apk
          echo 'PASS: v0.9.4 is reproducible against the official signed APK.'

      - name: Test 2 - record and verify upstream signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs official.apk | tee signing-certificate.txt
          grep -E 'Signer #1 certificate SHA-256 digest:' signing-certificate.txt
          apksigner verify --verbose official.apk
          echo 'PASS: official APK signature is valid and its SHA-256 certificate digest is recorded above.'

      - name: Test 4 preview - copy upstream signature onto rebuild and compare bytes
        shell: bash
        run: |
          set -euo pipefail
          apksigcopier copy official.apk rebuilt-unsigned.apk reconstructed-signed.apk
          apksigner verify --verbose --print-certs reconstructed-signed.apk
          cmp -s official.apk reconstructed-signed.apk
          echo 'PASS: copying the upstream signature onto the independent rebuild recreates the official APK byte-for-byte.'

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fdroid-repro-v094-evidence
          path: |
            signing-certificate.txt
          if-no-files-found: ignore
