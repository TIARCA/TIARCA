name: Prune already-merged branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-merged-branches.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-merged-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch all branch tips
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Delete only verified merged branch tips
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          api = f"https://api.github.com/repos/{repo}"
          token = os.environ["GITHUB_TOKEN"]

          def request(method, path):
              req = urllib.request.Request(
                  api + path,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          def pages(path):
              output = []
              page = 1
              while True:
                  separator = "&" if "?" in path else "?"
                  batch = request("GET", f"{path}{separator}per_page=100&page={page}")
                  output.extend(batch)
                  if len(batch) < 100:
                      return output
                  page += 1

          def branch_path(name):
              return "/branches/" + urllib.parse.quote(name, safe="/")

          branches = pages("/branches")
          open_prs = pages("/pulls?state=open")
          closed_prs = pages("/pulls?state=closed")
          protected = {"main"}
          for pr in open_prs:
              protected.add(pr["base"]["ref"])
              # Exclude names of all open PR heads, including forks (extra-safe).
              protected.add(pr["head"]["ref"])

          merged_pr_tips = {
              (pr["head"]["ref"], pr["head"]["sha"]): datetime.fromisoformat(
                  pr["merged_at"].replace("Z", "+00:00"))
              for pr in closed_prs
              if pr.get("merged_at") and pr["base"]["ref"] == "main"
              and pr["head"].get("repo")
              and pr["head"]["repo"]["full_name"] == repo
          }
          main_sha = request("GET", "/branches/main")["commit"]["sha"]

          def committed_before_merge(sha, merged_at):
              # A reused branch with commits after its merged PR must survive.
              result = subprocess.run(
                  ["git", "show", "-s", "--format=%cI", sha],
                  capture_output=True, text=True, check=False,
              )
              if result.returncode != 0:
                  return False
              committed = datetime.fromisoformat(result.stdout.strip())
              return committed <= merged_at + timedelta(minutes=2)

          def ancestor(sha):
              return subprocess.run(
                  ["git", "merge-base", "--is-ancestor", sha, main_sha],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0

          eligible = []
          skipped = []
          for b in branches:
              name, sha = b["name"], b["commit"]["sha"]
              if name in protected or b.get("protected"):
                  skipped.append({"branch": name, "reason": "protected or active PR"})
              elif ancestor(sha):
                  eligible.append({"branch": name, "sha": sha, "proof": "ancestor of main"})
              elif ((name, sha) in merged_pr_tips and
                    committed_before_merge(sha, merged_pr_tips[(name, sha)])):
                  eligible.append({"branch": name, "sha": sha, "proof": "merged PR to main; no newer tip"})
              else:
                  skipped.append({"branch": name, "reason": "not proven merged"})

          report = {
              "main": main_sha,
              "branch_count_before": len(branches),
              "planned": eligible,
              "deleted": [],
              "skipped": skipped,
              "failed": [],
          }
          print(f"Found {len(branches)} branches, {len(eligible)} verified merged; "
                f"preserving {len(skipped)} other branches", flush=True)
          for item in eligible:
              name = item["branch"]
              try:
                  current = request("GET", branch_path(name))
                  if current["commit"]["sha"] != item["sha"] or current.get("protected"):
                      report["skipped"].append({"branch": name, "reason": "changed or protected"})
                      continue
                  # Never delete an open PR head/base or any ref not proved merged.
                  request("DELETE", "/git/refs/heads/" +
                          urllib.parse.quote(name, safe="/"))
                  report["deleted"].append(item)
                  print(f"DELETED {name} @ {item['sha']} ({item['proof']})", flush=True)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      report["skipped"].append({"branch": name, "reason": "already deleted"})
                  else:
                      report["failed"].append({"branch": name, "http": error.code})
                      print(f"FAILED {name}: HTTP {error.code}", flush=True)
              except Exception as error:
                  report["failed"].append({"branch": name, "error": str(error)})
                  print(f"FAILED {name}: {error}", flush=True)

          with open("merged-branches-cleanup.json", "w", encoding="utf-8") as out:
              json.dump(report, out, ensure_ascii=False, indent=2)
          print(f"Deleted {len(report['deleted'])} branch(es); "
                f"{len(report['failed'])} failed; "
                f"{len(report['skipped'])} kept.", flush=True)
          if report["failed"]:
              raise SystemExit(1)
          PY

      - name: Preserve cleanup audit with names and old SHAs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: merged-branches-cleanup-audit
          path: merged-branches-cleanup.json
          retention-days: 30
