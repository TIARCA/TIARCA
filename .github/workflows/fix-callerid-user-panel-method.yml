name: Fix caller-id user panel method

on:
  push:
    branches:
      - fix/callerid-accept-user-panel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/callerid-accept-user-panel
      - name: Correct helper method
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/mrarm/irc/dialog/UserBottomSheetDialog.java')
          s = p.read_text()
          old = 'io.mrarm.irc.irc.CallerIdAcceptManager.acceptForVoluntaryPrivateChat(mConnection, mNick);'
          new = 'io.mrarm.irc.irc.CallerIdAcceptManager.acceptOutgoingPrivateConversation(mConnection, mNick);'
          if old not in s:
              raise SystemExit('expected stale helper call not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/fix-callerid-user-panel-method.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/mrarm/irc/dialog/UserBottomSheetDialog.java
          git commit -m "Use caller-id helper from user panel message action"
          git push origin HEAD:fix/callerid-accept-user-panel
