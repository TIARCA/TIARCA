name: Translation structure audit

on:
  push:
    branches:
      - translations/sync-locales-14482738850864919158
    paths:
      - app/src/main/res/values*/strings.xml
      - app/src/main/res/values*/strings_tiarca_sync.xml
      - tools/translation_structure_audit.py
      - .github/workflows/translation-structure-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Audit translation resources
        run: python tools/translation_structure_audit.py
