name: Validate SnakeYAML 2.7 Phase B1 (temporary)

on:
  push:
    branches:
      - validation/phase-b1-snakeyaml-27

permissions:
  contents: read

jobs:
  generated-settings:
    name: Compare generated settings sources against SnakeYAML 1.23
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline source
        uses: actions/checkout@v5
        with:
          ref: 9b48488560e54163d04a03b391dbb72f40994d0b
          path: baseline
      - name: Checkout updated source
        uses: actions/checkout@v5
        with:
          ref: e33f416b07c025ac3d8abd3665c4884439b0e9f5
          path: updated
      - name: Set up Java 17 (CI parity)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate baseline settings
        working-directory: baseline
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/b1-gradle-old
        run: ./gradlew --no-daemon :app:generateSettings
      - name: Generate updated settings
        working-directory: updated
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/b1-gradle-new
        run: ./gradlew --no-daemon :app:generateSettings
      - name: Compare generated Java source content
        shell: bash
        run: |
          set -euo pipefail
          OLD=baseline/app/build/generated/source/settings
          NEW=updated/app/build/generated/source/settings
          test -d "$OLD"
          test -d "$NEW"
          OLD_COUNT=$(find "$OLD" -type f -name '*.java' | wc -l)
          NEW_COUNT=$(find "$NEW" -type f -name '*.java' | wc -l)
          echo "Baseline Java classes: $OLD_COUNT"
          echo "Updated Java classes: $NEW_COUNT"
          test "$OLD_COUNT" -gt 0
          test "$OLD_COUNT" -eq "$NEW_COUNT"
          diff -ru "$OLD" "$NEW"
          echo "SnakeYAML 2.7 generated settings are byte-for-byte identical"

  candidate:
    name: Signed Candidate APKs (Standard + F-Droid)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact B1 source
        uses: actions/checkout@v5
        with:
          ref: e33f416b07c025ac3d8abd3665c4884439b0e9f5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Restore signing credentials
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks
          test -s tiarca-release.jks
          cat > keystore.properties <<EOF
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF
      - name: Build signed release APKs
        run: ./gradlew :app:assembleStandardRelease :app:assembleFdroidRelease
      - name: Verify both distribution APKs
        run: |
          python3 tools/verify_distribution_apk.py Standard
          python3 tools/verify_distribution_apk.py Fdroid
      - name: Verify APK signatures and expected certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          for FLAVOR in standard fdroid; do
            APK=$(find "app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            test -n "$APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "/tmp/b1-$FLAVOR-sign.txt"
            grep -qi 'e2141ddf7765bfe99b0eb34cae636cefde0228aeeb1a100ddd8c9d6c8e7718a7' "/tmp/b1-$FLAVOR-sign.txt"
          done
      - name: Save signed Candidate APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-apks
          for FLAVOR in standard fdroid; do
            APK=$(find "app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            cp "$APK" "candidate-apks/TIARCA-$FLAVOR-snakeyaml27-e33f416.apk"
          done
          (cd candidate-apks && sha256sum *.apk > SHA256SUMS)
      - name: Upload Candidate artifacts (no release)
        uses: actions/upload-artifact@v6
        with:
          name: TIARCA-snakeyaml27-candidate-e33f416
          path: candidate-apks/
          retention-days: 14

  reproducible:
    name: Independently built unsigned release APKs byte-for-byte
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - name: Checkout independent A
        uses: actions/checkout@v5
        with:
          ref: e33f416b07c025ac3d8abd3665c4884439b0e9f5
          path: build-a
          fetch-depth: 1
      - name: Checkout independent B
        uses: actions/checkout@v5
        with:
          ref: e33f416b07c025ac3d8abd3665c4884439b0e9f5
          path: build-b
          fetch-depth: 1
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm matching source and deterministic build inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C build-a rev-parse HEAD)" = "$(git -C build-b rev-parse HEAD)"
          SOURCE_DATE_EPOCH=$(git -C build-a show -s --format=%ct HEAD)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
      - name: Build A (clean, no cache)
        working-directory: build-a
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/b1-gradle-a
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleStandardRelease :app:assembleFdroidRelease
      - name: Build B (clean, no cache)
        working-directory: build-b
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/b1-gradle-b
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleStandardRelease :app:assembleFdroidRelease
      - name: Compare APKs byte for byte
        shell: bash
        run: |
          set -euo pipefail
          for FLAVOR in standard fdroid; do
            APK_A=$(find "build-a/app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            APK_B=$(find "build-b/app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            test -n "$APK_A"
            test -n "$APK_B"
            echo "$FLAVOR build A"
            sha256sum "$APK_A"
            echo "$FLAVOR build B"
            sha256sum "$APK_B"
            cmp "$APK_A" "$APK_B"
            echo "$FLAVOR: byte-for-byte identical"
          done
