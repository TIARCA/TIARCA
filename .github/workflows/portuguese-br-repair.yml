name: Brazilian Portuguese translation repair

on:
  push:
    branches:
      - translations/sync-locales-14482738850864919158
    paths:
      - tools/portuguese_br_repair.py
      - .github/workflows/portuguese-br-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: translations/sync-locales-14482738850864919158
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply reviewed Brazilian Portuguese repairs
        run: python tools/portuguese_br_repair.py
      - name: Commit repaired translations
        run: |
          if git diff --quiet -- app/src/main/res/values-pt-rBR/strings.xml; then
            echo "No Brazilian Portuguese translation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/values-pt-rBR/strings.xml
          git commit -m "Repair reviewed Brazilian Portuguese translations"
          git push
