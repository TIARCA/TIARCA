name: Temporary MODE styling patch

on:
  push:
    branches:
      - test/monochrome-all-mode-events

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/monochrome-all-mode-events
      - name: Apply focused MODE styling patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/io/mrarm/irc/util/MessageBuilder.java')
          s = p.read_text()
          s = s.replace('import android.graphics.Color;\n', 'import android.graphics.Color;\nimport android.graphics.Typeface;\n')
          s = s.replace('import android.text.style.ForegroundColorSpan;\n', 'import android.text.style.ForegroundColorSpan;\nimport android.text.style.StyleSpan;\n')
          old = '''            case MODE:\n                return processFormat(mEventMessageFormat, message.getDate(), null,\n                        buildModeMessage(senderNick, ((ChannelModeMessageInfo) message).getEntries(),\n                                clickSpanFactory));'''
          new = '''            case MODE:\n                return processFormat(mEventMessageFormat, message.getDate(), null,\n                        makeModeEventNeutral(buildModeMessage(senderNick,\n                                ((ChannelModeMessageInfo) message).getEntries(), clickSpanFactory)));'''
          if old not in s:
              raise SystemExit('MODE rendering block not found')
          s = s.replace(old, new)
          needle = '    private ClickableSpan getNickClickSpan(String nick, NickClickSpanFactory clickSpanFactory) {'
          helper = '''    private CharSequence makeModeEventNeutral(CharSequence message) {\n        SpannableStringBuilder neutral = new SpannableStringBuilder(message);\n\n        // MODE rows inherit the normal event foreground color for all text.\n        for (ForegroundColorSpan span : neutral.getSpans(0, neutral.length(),\n                ForegroundColorSpan.class)) {\n            neutral.removeSpan(span);\n        }\n\n        // Actor and affected nicknames remain clickable and are emphasized in bold.\n        for (ClickableSpan span : neutral.getSpans(0, neutral.length(), ClickableSpan.class)) {\n            int start = neutral.getSpanStart(span);\n            int end = neutral.getSpanEnd(span);\n            if (start >= 0 && end > start) {\n                neutral.setSpan(new StyleSpan(Typeface.BOLD), start, end,\n                        Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);\n            }\n        }\n        return neutral;\n    }\n\n'''
          if needle not in s:
              raise SystemExit('Insertion point not found')
          s = s.replace(needle, helper + needle)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/mrarm/irc/util/MessageBuilder.java
          git diff --cached --quiet && exit 0
          git commit -m "Render all MODE events in neutral color with bold actors"
          git push origin HEAD:test/monochrome-all-mode-events
