name: Fix MODE placeholders

on:
  push:
    branches:
      - translations/sync-locales

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: translations/sync-locales
      - name: Fix MODE placeholders
        run: python3 tools/fix_mode_placeholders.py
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No MODE placeholder changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res
          git commit -m "Fix MODE format placeholder indices"
          git push origin HEAD:translations/sync-locales
