name: Translation audit fix

on:
  push:
    branches:
      - translations/sync-locales
    paths:
      - 'tools/audit_translations.py'
      - '.github/workflows/translation-audit-fix.yml'
      - 'app/src/main/res/values*/strings*.xml'

permissions:
  contents: write

jobs:
  audit-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: translations/sync-locales
      - name: Normalize positional placeholders
        run: python3 tools/audit_translations.py || true
      - name: Commit mechanical placeholder fixes
        run: |
          if ! git diff --quiet -- app/src/main/res; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/res
            git commit -m 'Normalize Android string format placeholders'
            git push origin HEAD:translations/sync-locales
          fi
      - name: Final translation audit
        run: python3 tools/audit_translations.py
