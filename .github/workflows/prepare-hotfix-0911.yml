name: Prepare 0.9.1.1 hotfix metadata

on:
  push:
    branches:
      - hotfix/0.9.1.1-whowas
    paths:
      - '.github/workflows/prepare-hotfix-0911.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix/0.9.1.1-whowas
          fetch-depth: 0
      - name: Update changelog and README
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '# TIARCA — Changelog\n\n'
          section = '''## v0.9.1.1\n\n- Corretto il fallback **WHOWAS**: il numeric IRC `312`, condiviso con WHOIS, non viene più interpretato come una risposta WHOIS fuori sequenza e non compare più come riga protocollo grezza nella scheda **Server** durante la consultazione dei dati storici di un nickname.\n- Aggiunto un test di regressione per le risposte `312` ricevute durante WHOWAS.\n\n'''
          if '## v0.9.1.1\n' not in text:
              if not text.startswith(marker):
                  raise SystemExit('Unexpected CHANGELOG header')
              text = marker + section + text[len(marker):]
              changelog.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          r = r.replace('## Ultima release — TIARCA 0.9.1\n', '## Ultima release — TIARCA 0.9.1.1\n', 1)
          r = r.replace('La release stabile corrente è **TIARCA 0.9.1**.', 'La release stabile corrente è **TIARCA 0.9.1.1**.', 1)
          r = r.replace('[Scarica TIARCA 0.9.1 APK](https://github.com/TIARCA/TIARCA/releases/download/v0.9.1/TIARCA-v0.9.1.apk)', '[Scarica TIARCA 0.9.1.1 APK](https://github.com/TIARCA/TIARCA/releases/download/v0.9.1.1/TIARCA-v0.9.1.1.apk)', 1)
          r = r.replace('[Pagina della release 0.9.1](https://github.com/TIARCA/TIARCA/releases/tag/v0.9.1)', '[Pagina della release 0.9.1.1](https://github.com/TIARCA/TIARCA/releases/tag/v0.9.1.1)', 1)
          r = r.replace('La 0.9.1 introduce il controllo aggiornamenti integrato', 'La 0.9.1.1 include un hotfix per WHOWAS e mantiene tutte le novità della 0.9.1, che introduce il controllo aggiornamenti integrato', 1)
          readme.write_text(r, encoding='utf-8')
          PY
          rm .github/workflows/prepare-hotfix-0911.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md .github/workflows/prepare-hotfix-0911.yml
          git commit -m "Document TIARCA 0.9.1.1 hotfix"
          git push origin HEAD:hotfix/0.9.1.1-whowas
