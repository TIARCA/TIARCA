name: Publish TIARCA 0.9.1.8c hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-0918c-hotfix.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v5
        with:
          ref: d3bb28ebc42db54f893264bfbfc2b09e2bbcb96f
          fetch-depth: 0

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*versionName[[:space:]]+"0\.9\.1\.8c"' app/build.gradle
          grep -Eq '^[[:space:]]*versionCode[[:space:]]+90183' app/build.gradle
          grep -Fq '## v0.9.1.8c' CHANGELOG.md

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks

      - name: Create keystore.properties
        shell: bash
        run: |
          cat > keystore.properties <<EOF
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Prepare release assets and notes
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" TIARCA-v0.9.1.8c.apk
          sha256sum TIARCA-v0.9.1.8c.apk > TIARCA-v0.9.1.8c.apk.sha256
          awk '
            $0 == "## v0.9.1.8c" { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Tag exact release source
        shell: bash
        run: |
          set -euo pipefail
          git tag v0.9.1.8c d3bb28ebc42db54f893264bfbfc2b09e2bbcb96f
          git push origin v0.9.1.8c

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.9.1.8c \
            TIARCA-v0.9.1.8c.apk \
            TIARCA-v0.9.1.8c.apk.sha256 \
            --title "TIARCA v0.9.1.8c" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Remove temporary publisher workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B publisher-cleanup origin/main
          rm -f .github/workflows/publish-0918c-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-0918c-hotfix.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove temporary 0.9.1.8c publisher workflow"
          git push origin HEAD:main
