name: Spanish translation repair

on:
  push:
    branches:
      - translations/sync-locales-14482738850864919158
    paths:
      - tools/spanish_repair.py
      - .github/workflows/spanish-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: translations/sync-locales-14482738850864919158
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply reviewed Spanish repairs
        run: python tools/spanish_repair.py
      - name: Commit repaired Spanish translations
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/values-es/strings.xml
          git commit -m "Repair reviewed Spanish translations"
          git push
