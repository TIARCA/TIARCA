name: Regenerate Gradle 8.14.6 Wrapper (temporary)

on:
  push:
    branches:
      - build/wrapper-and-agp-8.13.2

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: build/wrapper-and-agp-8.13.2

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Regenerate scripts, JAR and distribution checksum
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.14.6 --distribution-type bin --gradle-distribution-sha256-sum 7988ed071b2a07900e2ec715fca15c6ab72bce6db433af301fa7fa7e9407bd24
          ./gradlew wrapper --gradle-version 8.14.6 --distribution-type bin --gradle-distribution-sha256-sum 7988ed071b2a07900e2ec715fca15c6ab72bce6db433af301fa7fa7e9407bd24
          grep -Fx 'distributionSha256Sum=7988ed071b2a07900e2ec715fca15c6ab72bce6db433af301fa7fa7e9407bd24' gradle/wrapper/gradle-wrapper.properties
          echo 'ad16bca46cb71bb5887c546860d93992aeee35c1fdaf4a242b0a612375d937e0  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          ./gradlew --version

      - name: Commit generated Wrapper files to branch only
        shell: bash
        run: |
          set -euo pipefail
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: regenerate Gradle 8.14.6 wrapper scripts and JAR'
            git push origin HEAD:build/wrapper-and-agp-8.13.2
          fi
