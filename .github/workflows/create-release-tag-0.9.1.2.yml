name: Create TIARCA v0.9.1.2 tag

on:
  push:
    paths:
      - '.github/workflows/create-release-tag-0.9.1.2.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ec6b6a76f3fb7390b181983b9f755b0dac4a6150
          fetch-depth: 0
      - name: Create and push v0.9.1.2
        run: |
          git tag v0.9.1.2 ec6b6a76f3fb7390b181983b9f755b0dac4a6150
          git push origin v0.9.1.2
