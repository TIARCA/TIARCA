name: Publish TIARCA 0.9.1.6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-0916.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: c44028c0a82acb170126a860f24ee2d4cc6364a1
          fetch-depth: 0

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 9016' app/build.gradle
          grep -q 'versionName "0.9.1.6"' app/build.gradle
          grep -q '^## v0.9.1.6' CHANGELOG.md

      - name: Create exact release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/v0.9.1.6 >/dev/null 2>&1; then
            echo "Tag v0.9.1.6 already exists"
          else
            git tag v0.9.1.6 c44028c0a82acb170126a860f24ee2d4cc6364a1
            git push origin refs/tags/v0.9.1.6
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks

      - name: Create keystore.properties
        shell: bash
        run: |
          cat > keystore.properties <<EOF
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Name APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK" "TIARCA-v0.9.1.6.apk"
          sha256sum TIARCA-v0.9.1.6.apk > TIARCA-v0.9.1.6.apk.sha256

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          awk '/^## v0\.9\.1\.6$/{f=1;next} f&&/^## v/{exit} f{print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.1.6
          name: TIARCA v0.9.1.6
          files: |
            TIARCA-v0.9.1.6.apk
            TIARCA-v0.9.1.6.apk.sha256
          body_path: release-notes.md
