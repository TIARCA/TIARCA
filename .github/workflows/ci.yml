name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [Standard, Fdroid]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Test native Lua host moderation regressions
        if: matrix.flavor == 'Standard'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/lua-native-host/classes
          cmake -S app/src/main/cpp -B build/lua-native-host/cmake \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_C_FLAGS=-I${JAVA_HOME}/include -I${JAVA_HOME}/include/linux"
          cmake --build build/lua-native-host/cmake --parallel 2
          javac -d build/lua-native-host/classes \
            app/src/main/java/io/mrarm/irc/lua/NativeLuaRuntime.java \
            tools/lua-native-poc/HostLuaRuntimeTest.java
          java -Djava.library.path=build/lua-native-host/cmake \
            -cp build/lua-native-host/classes \
            io.mrarm.irc.lua.HostLuaRuntimeTest

      - name: Audit translation resources
        run: python tools/translation_structure_audit.py

      - name: Verify release home is synchronized
        run: python tools/sync_release_home.py --check

      - name: Configure Gradle caching and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Cache verified Gradle 9.9.0 archive
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tiarca-gradle-archive/gradle-9.9.0-bin.zip
          key: tiarca-gradle-dist-9.9.0-0b00b0ffe07c4d4789c12d4935a44a7057d55774b7540bd4a3f76f336deb177a

      - name: Install checksum-verified Gradle 9.9.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/install_pinned_gradle.sh

      - name: Inventory resolved dependencies
        shell: bash
        run: |
          set -euo pipefail
          variant="${{ matrix.flavor }}"
          variant="${variant,}"
          mkdir -p build/dependency-audit
          gradle :app:dependencies --configuration "${variant}ReleaseRuntimeClasspath" > "build/dependency-audit/${variant}-release-runtime.txt"
          gradle :app:dependencies --configuration "${variant}DebugRuntimeClasspath" > "build/dependency-audit/${variant}-debug-runtime.txt"
          gradle :app:dependencies --configuration "${variant}DebugUnitTestRuntimeClasspath" > "build/dependency-audit/${variant}-unit-test-runtime.txt"
          gradle :chatlib:dependencies --configuration testRuntimeClasspath > "build/dependency-audit/chatlib-test-runtime.txt"
          gradle buildEnvironment > "build/dependency-audit/buildscript-runtime.txt"
          gradle -p app/ircSettingsPlugin dependencies --configuration runtimeClasspath > "build/dependency-audit/settings-plugin-runtime.txt"

      - name: Run unit tests
        run: gradle :chatlib:test :app:test${{ matrix.flavor }}DebugUnitTest

      - name: Build release APK
        run: gradle :app:assemble${{ matrix.flavor }}Release

      - name: Verify distribution APK
        run: python tools/verify_distribution_apk.py ${{ matrix.flavor }}

      # Run application compilation/tests before known build-tool CVEs fail the audit gate.
      # OSV still fails the job: do not downgrade security findings to warnings.
      - name: Check resolved dependencies against OSV advisories
        run: python tools/audit_maven_osv.py build/dependency-audit --output build/dependency-audit/osv-findings.json

      - name: Upload dependency inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-inventory-${{ matrix.flavor }}
          path: build/dependency-audit/
          retention-days: 7

