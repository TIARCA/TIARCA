name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Audit translation resources
        run: python tools/translation_structure_audit.py

      - name: Verify release home is synchronized
        run: python tools/sync_release_home.py --check

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

  cleanup-actions-history:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete runs from obsolete workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          KEEP_PATHS='[".github/workflows/ci.yml",".github/workflows/candidate.yml",".github/workflows/release.yml"]'

          mapfile -t WORKFLOWS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
              --jq ".workflows[] | select((.path as \$p | ${KEEP_PATHS} | index(\$p)) == null) | [.id, .name, .path, .state] | @tsv"
          )

          if [[ ${#WORKFLOWS[@]} -eq 0 ]]; then
            echo "No obsolete workflow records found."
            exit 0
          fi

          deleted=0
          for workflow in "${WORKFLOWS[@]}"; do
            IFS=$'\t' read -r workflow_id workflow_name workflow_path workflow_state <<< "$workflow"
            echo "Cleaning obsolete workflow: id=${workflow_id} name=${workflow_name} path=${workflow_path} state=${workflow_state}"

            mapfile -t RUNS < <(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
                --jq '.workflow_runs[].id'
            )

            for run_id in "${RUNS[@]}"; do
              echo "Deleting run ${run_id}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
              deleted=$((deleted + 1))
            done
          done

          echo "Deleted ${deleted} obsolete workflow run(s)."
