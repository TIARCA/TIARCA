name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [Standard, Fdroid]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Audit translation resources
        run: python tools/translation_structure_audit.py

      - name: Verify release home is synchronized
        run: python tools/sync_release_home.py --check

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Inventory resolved dependencies
        shell: bash
        run: |
          set -euo pipefail
          variant="${{ matrix.flavor }}"
          variant="${variant,}"
          mkdir -p build/dependency-audit
          ./gradlew :app:dependencies --configuration "${variant}ReleaseRuntimeClasspath" > "build/dependency-audit/${variant}-release-runtime.txt"
          ./gradlew :app:dependencies --configuration "${variant}DebugRuntimeClasspath" > "build/dependency-audit/${variant}-debug-runtime.txt"
          ./gradlew :app:dependencies --configuration "${variant}DebugUnitTestRuntimeClasspath" > "build/dependency-audit/${variant}-unit-test-runtime.txt"
          ./gradlew :chatlib:dependencies --configuration testRuntimeClasspath > "build/dependency-audit/chatlib-test-runtime.txt"
          ./gradlew buildEnvironment > "build/dependency-audit/buildscript-runtime.txt"
          ./gradlew -p app/ircSettingsPlugin dependencies --configuration runtimeClasspath > "build/dependency-audit/settings-plugin-runtime.txt"

      - name: Run unit tests
        run: ./gradlew :app:test${{ matrix.flavor }}DebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assemble${{ matrix.flavor }}Debug :app:assemble${{ matrix.flavor }}Release

      - name: Verify distribution APK
        run: python tools/verify_distribution_apk.py ${{ matrix.flavor }}

      # Run application compilation/tests before known build-tool CVEs fail the audit gate.
      # OSV still fails the job: do not downgrade security findings to warnings.
      - name: Check resolved dependencies against OSV advisories
        run: python tools/audit_maven_osv.py build/dependency-audit --output build/dependency-audit/osv-findings.json

      - name: Upload dependency inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-inventory-${{ matrix.flavor }}
          path: build/dependency-audit/
          retention-days: 7

