name: Apply TIARCA-026

on:
  push:
    branches:
      - feature/tiarca-026-nick-tap-action
    paths:
      - .github/workflows/tiarca-026-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/tiarca-026-nick-tap-action
          fetch-depth: 0

      - name: Apply source changes
        run: python tools/tiarca026_apply.py

      - name: Verify version is unchanged
        run: |
          grep -F 'versionCode 90900' app/build.gradle
          grep -F 'versionName "0.9.9"' app/build.gradle

      - name: Commit implementation and cleanup helpers
        run: |
          set -euo pipefail
          git rm .github/workflows/tiarca-026-apply.yml tools/tiarca026_apply.py
          git add app/settings.yml \
            app/src/main/java/io/mrarm/irc/setting/fragment/InterfaceSettingsFragment.java \
            app/src/main/java/io/mrarm/irc/view/ChatAutoCompleteEditText.java \
            app/src/main/java/io/mrarm/irc/chat/ChatFragmentSendMessageHelper.java \
            app/src/main/java/io/mrarm/irc/chat/ChatMessagesAdapter.java \
            app/src/main/res/values*/strings_tiarca_026.xml \
            app/src/test/java/io/mrarm/irc/NicknameTapActionStructureTest.java
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "TIARCA-026: add configurable nickname tap action"
          git push origin HEAD:feature/tiarca-026-nick-tap-action
