name: Verify phase A Zip4j and Gson (isolated)

on:
  push:
    branches:
      - validation/phase-a-zip4j-gson

permissions:
  contents: read

jobs:
  signed-candidate:
    name: Signed candidate Standard and F-Droid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact phase A source
        uses: actions/checkout@v5
        with:
          ref: e1c38ddc2053d091858de57379c2d6682654f587

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore existing release signing
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.TIARCA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > tiarca-release.jks
          test -s tiarca-release.jks
          cat > keystore.properties <<EOF
          storeFile=tiarca-release.jks
          storePassword=${{ secrets.TIARCA_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TIARCA_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.TIARCA_RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed release APKs
        run: ./gradlew :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Verify Standard and F-Droid distributions
        run: |
          python3 tools/verify_distribution_apk.py Standard
          python3 tools/verify_distribution_apk.py Fdroid

      - name: Verify signatures and expected certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          for FLAVOR in standard fdroid; do
            APK=$(find "app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            test -n "$APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "/tmp/$FLAVOR-signing.txt"
            grep -qi 'e2141ddf7765bfe99b0eb34cae636cefde0228aeeb1a100ddd8c9d6c8e7718a7' "/tmp/$FLAVOR-signing.txt"
          done

      - name: Collect Candidate APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-apks
          for FLAVOR in standard fdroid; do
            APK=$(find "app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            cp "$APK" "candidate-apks/TIARCA-$FLAVOR-phase-a-e1c38dd.apk"
          done
          (cd candidate-apks && sha256sum *.apk > SHA256SUMS)

      - name: Upload signed candidate APKs
        uses: actions/upload-artifact@v6
        with:
          name: TIARCA-phase-a-candidate-e1c38dd
          path: candidate-apks/
          retention-days: 14

  reproducible:
    name: Independent byte-identical Standard and F-Droid APKs
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - name: Checkout independent A
        uses: actions/checkout@v5
        with:
          ref: e1c38ddc2053d091858de57379c2d6682654f587
          path: build-a
          fetch-depth: 1

      - name: Checkout independent B
        uses: actions/checkout@v5
        with:
          ref: e1c38ddc2053d091858de57379c2d6682654f587
          path: build-b
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare reproducible build environments
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git -C build-a show -s --format=%ct HEAD)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          test "$(git -C build-a rev-parse HEAD)" = "$(git -C build-b rev-parse HEAD)"

      - name: Build A independently
        working-directory: build-a
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-a
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Build B independently
        working-directory: build-b
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-b
        run: ./gradlew --no-daemon --no-build-cache clean :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Compare APKs byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          for FLAVOR in standard fdroid; do
            APK_A=$(find "build-a/app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            APK_B=$(find "build-b/app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            test -n "$APK_A"
            test -n "$APK_B"
            echo "$FLAVOR build A"
            sha256sum "$APK_A"
            echo "$FLAVOR build B"
            sha256sum "$APK_B"
            cmp "$APK_A" "$APK_B"
            echo "$FLAVOR: byte-for-byte identical"
          done
