name: Verify TIARCA reproducible APKs

on:
  pull_request:
    paths:
      - '.github/workflows/reproducible-audit.yml'
      - '.github/workflows/ci.yml'
      - 'app/**'
      - 'chatlib/**'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-independent-builds:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - name: Checkout A
        uses: actions/checkout@v5
        with:
          path: build-a
          fetch-depth: 1

      - name: Checkout B
        uses: actions/checkout@v5
        with:
          path: build-b
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Tool installation is shared, but the two builds have isolated GRADLE_USER_HOME
      # and sources; no resolved dependencies or build outputs are shared.
      - name: Setup pinned Gradle 9.9.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'
          cache-provider: basic

      - name: Prepare deterministic environment
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build-a/gradlew build-b/gradlew
          SOURCE_DATE_EPOCH=$(git -C build-a show -s --format=%ct HEAD)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          test "$(git -C build-a rev-parse HEAD)" = "$(git -C build-b rev-parse HEAD)"

      - name: Build unsigned APKs A
        working-directory: build-a
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/tiarca-gradle-a
        run: gradle --no-daemon --no-build-cache clean :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Build unsigned APKs B
        working-directory: build-b
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/tiarca-gradle-b
        run: gradle --no-daemon --no-build-cache clean :app:assembleStandardRelease :app:assembleFdroidRelease

      - name: Compare APKs byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reproducibility-report
          for flavor in standard fdroid; do
            apk_a=$(find "build-a/app/build/outputs/apk/$flavor/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            apk_b=$(find "build-b/app/build/outputs/apk/$flavor/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
            test -n "$apk_a" && test -n "$apk_b"
            sha256sum "$apk_a" "$apk_b" | tee "reproducibility-report/$flavor.sha256"
            cmp "$apk_a" "$apk_b"
            echo "$flavor: byte-for-byte identical"
          done

      - name: Generate Gradle SHA-256 catalog A
        working-directory: build-a
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/tiarca-gradle-a
        run: gradle --no-daemon --write-verification-metadata sha256 :app:assembleStandardRelease :app:assembleFdroidRelease :app:testStandardDebugUnitTest :app:testFdroidDebugUnitTest

      - name: Generate Gradle SHA-256 catalog B
        working-directory: build-b
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/tiarca-gradle-b
        run: gradle --no-daemon --write-verification-metadata sha256 :app:assembleStandardRelease :app:assembleFdroidRelease :app:testStandardDebugUnitTest :app:testFdroidDebugUnitTest

      - name: Compare independently generated checksum catalogs
        shell: bash
        run: |
          set -euo pipefail
          if ! cmp -s build-a/gradle/verification-metadata.xml build-b/gradle/verification-metadata.xml; then
            echo "::error::Independently resolved Gradle SHA-256 catalogs differ"
            # Keep the complete evidence and print a bounded diff, without bypassing the gate.
            cp build-a/gradle/verification-metadata.xml reproducibility-report/verification-metadata-A.xml
            cp build-b/gradle/verification-metadata.xml reproducibility-report/verification-metadata-B.xml
            diff -u build-a/gradle/verification-metadata.xml build-b/gradle/verification-metadata.xml > reproducibility-report/catalog.diff || true
            head -n 160 reproducibility-report/catalog.diff
            exit 1
          fi
          cp build-a/gradle/verification-metadata.xml reproducibility-report/verification-metadata.xml
          sha256sum reproducibility-report/verification-metadata.xml

      - name: Upload reproducibility hashes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reproducibility-sha256
          path: reproducibility-report/
          if-no-files-found: ignore
          retention-days: 7
