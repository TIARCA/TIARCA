name: Finalize WHOWAS hotfix metadata
on:
  push:
    paths:
      - '.github/workflows/apply-whowas-fix.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whowas-routing-readme
      - name: Update changelog and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text()
          marker='# TIARCA — Changelog\n'
          assert s.startswith(marker)
          entry='''\n## v0.9.1.3\n\n- Corretto WHOWAS: il collector viene ora installato alla creazione di ogni connessione IRC, prima dell'avvio del thread di rete, così le risposte non ricadono più come numeric `314`/`369` grezzi nella scheda Server.\n- Le risposte WHOWAS vengono raccolte come record strutturati anche quando il comando parte da `/WHOWAS` o da altri ingressi oltre al dialog dedicato; restano supportati record multipli e l'associazione del `312` quando il server lo fornisce.\n- Aggiornata la home del repository, rimasta erroneamente ferma alla 0.9.1.1.\n'''
          p.write_text(marker+entry+s[len(marker):])
          PY
          rm .github/workflows/apply-whowas-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md .github/workflows/apply-whowas-fix.yml
          git commit -m 'Document TIARCA 0.9.1.3 WHOWAS hotfix'
          git push origin HEAD:fix/whowas-routing-readme
