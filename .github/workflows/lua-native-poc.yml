name: Lua native POC (experimental)

on:
  push:
    branches:
      - feature/lua-scripting-sandbox-poc
    paths:
      - 'tools/lua-native-poc/**'
      - '.github/workflows/lua-native-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-native-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LUA_VERSION: "5.5.1"
      LUA_SHA256: "1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce"
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v5

      - name: Download official Lua sources with pinned checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/lua-source
          curl -fLsS --retry 3 --connect-timeout 20 \
            "https://www.lua.org/ftp/lua-${LUA_VERSION}.tar.gz" \
            -o "build/lua-source/lua-${LUA_VERSION}.tar.gz"
          cd build/lua-source
          printf '%s  %s\n' "${LUA_SHA256}" "lua-${LUA_VERSION}.tar.gz" | sha256sum --check -
          tar -xzf "lua-${LUA_VERSION}.tar.gz"

      - name: Compile and test native sandbox on Linux host
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/lua-native-poc -B build/lua-host -DCMAKE_BUILD_TYPE=Release \
            -DLUA_SOURCE_DIR="$PWD/build/lua-source/lua-${LUA_VERSION}/src"
          cmake --build build/lua-host --parallel 2
          ctest --test-dir build/lua-host --output-on-failure

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}"
          test -f "$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake"

      - name: Build Android ARM64 JNI twice and compare exact bytes
        shell: bash
        run: |
          set -euo pipefail
          for variant in a b; do
            cmake -S tools/lua-native-poc -B "build/lua-android-$variant" \
              -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
              -DLUA_SOURCE_DIR="$PWD/build/lua-source/lua-${LUA_VERSION}/src"
            cmake --build "build/lua-android-$variant" --parallel 2
          done
          a=build/lua-android-a/libtiarca_lua_probe.so
          b=build/lua-android-b/libtiarca_lua_probe.so
          toolbin="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo 'Unstripped build hashes (diagnostic):'
          sha256sum "$a" "$b"
          if cmp -s "$a" "$b"; then
            echo 'Unstripped binaries are byte-identical'
          else
            echo 'Unstripped binaries differ; checking whether nondeterminism is limited to removable metadata'
            "$toolbin/llvm-readelf" -SW "$a" | tail -25
            cmp -l "$a" "$b" | head -12 || true
          fi
          "$toolbin/llvm-strip" --strip-all -o build/lua-android-a/libtiarca_lua_probe-stripped.so "$a"
          "$toolbin/llvm-strip" --strip-all -o build/lua-android-b/libtiarca_lua_probe-stripped.so "$b"
          echo 'Stripped production-style build hashes:'
          sha256sum build/lua-android-{a,b}/libtiarca_lua_probe-stripped.so
          cmp build/lua-android-a/libtiarca_lua_probe-stripped.so build/lua-android-b/libtiarca_lua_probe-stripped.so
          stat --printf='Android arm64-v8a raw .so: %s bytes\n' "$a"
          stat --printf='Android arm64-v8a stripped .so: %s bytes\n' \
            build/lua-android-a/libtiarca_lua_probe-stripped.so

      - name: Verify 16 KiB ELF load segment alignment
        shell: bash
        run: |
          set -euo pipefail
          lib=build/lua-android-a/libtiarca_lua_probe.so
          readelf="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$readelf" -lW "$lib" > build/lua-android-a/elf-headers.txt
          python3 - "$lib" <<'PY'
          import subprocess, sys, os
          lib = sys.argv[1]
          ndk = os.environ["ANDROID_HOME"]
          readelf = f'{ndk}/ndk/{os.environ["NDK_VERSION"]}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf'
          data = subprocess.check_output([readelf, "-lW", lib], text=True)
          alignments = [int(line.split()[-1], 16) for line in data.splitlines()
                        if line.strip().startswith("LOAD ")]
          assert alignments and min(alignments) >= 16384, alignments
          print("ELF LOAD segment alignments:", alignments)
          PY

      - name: Upload only temporary native experiment output
        uses: actions/upload-artifact@v6
        with:
          name: lua-5.5.1-android-arm64-poc
          path: |
            build/lua-android-a/libtiarca_lua_probe.so
            build/lua-android-a/libtiarca_lua_probe-stripped.so
            build/lua-android-a/elf-headers.txt
          retention-days: 7
