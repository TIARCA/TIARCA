name: Temporary event opt-in patch
on:
  push:
    branches: [fix/opt-in-monochrome-events]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/opt-in-monochrome-events
      - name: Apply event opt-in fix
        shell: python
        run: |
          from pathlib import Path

          # Register defaults.
          p = Path('app/src/main/java/io/mrarm/irc/config/SettingsHelper.java')
          s = p.read_text()
          old = '''        o = AutomatedSenderSettings.getDefaultValue(key);\n        if (o != null)\n            return o;'''
          new = '''        o = EventDisplaySettings.getDefaultValue(key);\n        if (o != null)\n            return o;\n        o = AutomatedSenderSettings.getDefaultValue(key);\n        if (o != null)\n            return o;'''
          if old not in s: raise SystemExit('SettingsHelper insertion point missing')
          p.write_text(s.replace(old, new))

          # Replace obsolete bot-only UI toggle with four explicit event opt-ins.
          p = Path('app/src/main/java/io/mrarm/irc/setting/fragment/InterfaceSettingsFragment.java')
          s = p.read_text()
          s = s.replace('import io.mrarm.irc.config.AutomatedSenderSettings;\n',
                        'import io.mrarm.irc.config.EventDisplaySettings;\n')
          old = '''        a.add(new CheckBoxSetting(getString(R.string.pref_title_monochrome_bots),\n                getString(R.string.pref_summary_monochrome_bots))\n                .linkSetting(prefs, AutomatedSenderSettings.PREF_MONOCHROME_BOTS));'''
          new = '''        a.add(new CheckBoxSetting(getString(R.string.pref_title_monochrome_mode),\n                getString(R.string.pref_summary_monochrome_mode))\n                .linkSetting(prefs, EventDisplaySettings.PREF_MONOCHROME_MODE));\n        a.add(new CheckBoxSetting(getString(R.string.pref_title_monochrome_kick),\n                getString(R.string.pref_summary_monochrome_kick))\n                .linkSetting(prefs, EventDisplaySettings.PREF_MONOCHROME_KICK));\n        a.add(new CheckBoxSetting(getString(R.string.pref_title_monochrome_quit),\n                getString(R.string.pref_summary_monochrome_quit))\n                .linkSetting(prefs, EventDisplaySettings.PREF_MONOCHROME_QUIT));\n        a.add(new CheckBoxSetting(getString(R.string.pref_title_monochrome_join_part),\n                getString(R.string.pref_summary_monochrome_join_part))\n                .linkSetting(prefs, EventDisplaySettings.PREF_MONOCHROME_JOIN_PART));'''
          if old not in s: raise SystemExit('Interface toggle block missing')
          p.write_text(s.replace(old, new))

          # Make each event family opt-in. Defaults remain original rendering.
          p = Path('app/src/main/java/io/mrarm/irc/util/MessageBuilder.java')
          s = p.read_text()
          s = s.replace('import io.mrarm.irc.config.AutomatedSenderSettings;\n',
                        'import io.mrarm.irc.config.AutomatedSenderSettings;\nimport io.mrarm.irc.config.EventDisplaySettings;\n')

          # MODE participants must only become bold when the opt-in is active.
          s = s.replace('buildClickableBoldColoredNick(entry.getKey(), clickSpanFactory)',
                        'buildClickableColoredNick(entry.getKey(), clickSpanFactory)')
          s = s.replace('buildClickableBoldColoredNick(senderNick, clickSpanFactory)',
                        'buildClickableColoredNick(senderNick, clickSpanFactory)')
          start = s.find('    private CharSequence buildClickableBoldColoredNick(')
          if start >= 0:
              end = s.find('    private CharSequence buildClickableColoredNick(', start)
              if end < 0: raise SystemExit('bold helper end missing')
              s = s[:start] + s[end:]

          old = '''            case JOIN:\n                return processFormat(mEventMessageFormat, message.getDate(), null,\n                        SpannableStringHelper.getText(mContext, R.string.message_join,\n                                buildColoredNickWithHostname(message.getSender(), clickSpanFactory)));'''
          new = '''            case JOIN: {\n                CharSequence event = SpannableStringHelper.getText(mContext, R.string.message_join,\n                        buildColoredNickWithHostname(message.getSender(), clickSpanFactory));\n                if (isNeutralEventEnabled(EventDisplaySettings.PREF_MONOCHROME_JOIN_PART))\n                    event = makeEventNeutral(event, true);\n                return processFormat(mEventMessageFormat, message.getDate(), null, event);\n            }'''
          if old not in s: raise SystemExit('JOIN block missing')
          s = s.replace(old, new)

          old = '''            case PART:\n                return processFormat(mEventMessageFormat, message.getDate(), null,\n                        SpannableStringHelper.getText(mContext,\n                                message.getMessage() == null ? R.string.message_part_no_message : R.string.message_part,\n                                buildColoredNickWithHostname(message.getSender(), clickSpanFactory),\n                                message.getMessage()));'''
          new = '''            case PART: {\n                CharSequence event = SpannableStringHelper.getText(mContext,\n                        message.getMessage() == null ? R.string.message_part_no_message : R.string.message_part,\n                        buildColoredNickWithHostname(message.getSender(), clickSpanFactory),\n                        message.getMessage());\n                if (isNeutralEventEnabled(EventDisplaySettings.PREF_MONOCHROME_JOIN_PART))\n                    event = makeEventNeutral(event, true);\n                return processFormat(mEventMessageFormat, message.getDate(), null, event);\n            }'''
          if old not in s: raise SystemExit('PART block missing')
          s = s.replace(old, new)

          old = '''                return processFormat(mEventMessageFormat, message.getDate(), null,\n                        SpannableStringHelper.getText(mContext,\n                                R.string.message_kick,\n                                buildClickableColoredNick(senderNick, clickSpanFactory),\n                                buildClickableColoredNick(kickedNick, clickSpanFactory),\n                                message.getMessage()));'''
          new = '''                CharSequence event = SpannableStringHelper.getText(mContext,\n                        R.string.message_kick,\n                        buildClickableColoredNick(senderNick, clickSpanFactory),\n                        buildClickableColoredNick(kickedNick, clickSpanFactory),\n                        message.getMessage());\n                if (isNeutralEventEnabled(EventDisplaySettings.PREF_MONOCHROME_KICK))\n                    event = makeEventNeutral(event, true);\n                return processFormat(mEventMessageFormat, message.getDate(), null, event);'''
          if old not in s: raise SystemExit('KICK block missing')
          s = s.replace(old, new)

          old = '''            case QUIT:\n                return processFormat(mEventMessageFormat, message.getDate(), null,\n                        SpannableStringHelper.getText(mContext, R.string.message_quit,\n                                buildColoredNickWithHostname(message.getSender(), clickSpanFactory),\n                                message.getMessage()));'''
          new = '''            case QUIT: {\n                CharSequence event = SpannableStringHelper.getText(mContext, R.string.message_quit,\n                        buildColoredNickWithHostname(message.getSender(), clickSpanFactory),\n                        message.getMessage());\n                if (isNeutralEventEnabled(EventDisplaySettings.PREF_MONOCHROME_QUIT))\n                    event = makeEventNeutral(event, true);\n                return processFormat(mEventMessageFormat, message.getDate(), null, event);\n            }'''
          if old not in s: raise SystemExit('QUIT block missing')
          s = s.replace(old, new)

          old = '''            case MODE:\n                return processFormat(mEventMessageFormat, message.getDate(), null,\n                        makeModeEventNeutral(buildModeMessage(senderNick,\n                                ((ChannelModeMessageInfo) message).getEntries(), clickSpanFactory)));'''
          new = '''            case MODE: {\n                CharSequence event = buildModeMessage(senderNick,\n                        ((ChannelModeMessageInfo) message).getEntries(), clickSpanFactory);\n                if (isNeutralEventEnabled(EventDisplaySettings.PREF_MONOCHROME_MODE))\n                    event = makeEventNeutral(event, true);\n                return processFormat(mEventMessageFormat, message.getDate(), null, event);\n            }'''
          if old not in s: raise SystemExit('MODE block missing')
          s = s.replace(old, new)

          old = '''    private CharSequence makeModeEventNeutral(CharSequence message) {\n        SpannableStringBuilder neutral = new SpannableStringBuilder(message);\n\n        // MODE rows inherit the normal event foreground color for all text.\n        for (ForegroundColorSpan span : neutral.getSpans(0, neutral.length(),\n                ForegroundColorSpan.class)) {\n            neutral.removeSpan(span);\n        }\n\n        return neutral;\n    }'''
          new = '''    private boolean isNeutralEventEnabled(String preference) {\n        return DefaultPreferences.get(mContext).getBoolean(preference, false);\n    }\n\n    private CharSequence makeEventNeutral(CharSequence message, boolean boldParticipants) {\n        SpannableStringBuilder neutral = new SpannableStringBuilder(message);\n\n        // Removing event-local foreground spans lets the normal event/status color show through.\n        for (ForegroundColorSpan span : neutral.getSpans(0, neutral.length(),\n                ForegroundColorSpan.class)) {\n            neutral.removeSpan(span);\n        }\n\n        if (boldParticipants) {\n            for (ClickableSpan span : neutral.getSpans(0, neutral.length(), ClickableSpan.class)) {\n                int start = neutral.getSpanStart(span);\n                int end = neutral.getSpanEnd(span);\n                if (start >= 0 && end > start)\n                    neutral.setSpan(new StyleSpan(Typeface.BOLD), start, end,\n                            Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);\n            }\n        }\n        return neutral;\n    }'''
          if old not in s: raise SystemExit('neutral helper missing')
          p.write_text(s.replace(old, new))

          # English fallback and Italian UI copy.
          Path('app/src/main/res/values/strings_monochrome_events.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="pref_title_monochrome_mode">Display MODE in black and white</string>\n    <string name="pref_summary_monochrome_mode">Use the neutral event color for MODE, with participants in bold</string>\n    <string name="pref_title_monochrome_kick">Display KICK in black and white</string>\n    <string name="pref_summary_monochrome_kick">Use the neutral event color for KICK, with participants in bold</string>\n    <string name="pref_title_monochrome_quit">Display QUIT in black and white</string>\n    <string name="pref_summary_monochrome_quit">Use the neutral event color for QUIT, with the participant in bold</string>\n    <string name="pref_title_monochrome_join_part">Display JOIN/PART in black and white</string>\n    <string name="pref_summary_monochrome_join_part">Use the neutral event color for JOIN and PART, with participants in bold</string>\n</resources>\n''')
          Path('app/src/main/res/values-it/strings_monochrome_events.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="pref_title_monochrome_mode">Visualizza MODE in bianco e nero</string>\n    <string name="pref_summary_monochrome_mode">Usa il colore neutro degli eventi per i MODE, con i partecipanti in grassetto</string>\n    <string name="pref_title_monochrome_kick">Visualizza KICK in bianco e nero</string>\n    <string name="pref_summary_monochrome_kick">Usa il colore neutro degli eventi per i KICK, con i partecipanti in grassetto</string>\n    <string name="pref_title_monochrome_quit">Visualizza QUIT in bianco e nero</string>\n    <string name="pref_summary_monochrome_quit">Usa il colore neutro degli eventi per i QUIT, con il partecipante in grassetto</string>\n    <string name="pref_title_monochrome_join_part">Visualizza JOIN/PART in bianco e nero</string>\n    <string name="pref_summary_monochrome_join_part">Usa il colore neutro degli eventi per JOIN e PART, con i partecipanti in grassetto</string>\n</resources>\n''')
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main
          git diff --cached --quiet && exit 0
          git commit -m "Make monochrome channel events opt-in"
          git push origin HEAD:fix/opt-in-monochrome-events
