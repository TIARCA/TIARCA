apply plugin: 'com.android.application'
apply plugin: 'io.mrarm.irc.build.settings-builder'

def releasePropertiesFile = rootProject.file('keystore.properties')
def releaseProperties = new Properties()
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}

android {
    compileSdkVersion 36
    defaultConfig {
        applicationId "io.tiarca.irc"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 606
        versionName "0.6.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        vectorDrawables.useSupportLibrary = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (releasePropertiesFile.exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file(releaseProperties['storeFile'])
                storePassword releaseProperties['storePassword']
                keyAlias releaseProperties['keyAlias']
                keyPassword releaseProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releasePropertiesFile.exists())
                signingConfig signingConfigs.release
        }
        debug {
            multiDexEnabled true
        }
    }
    namespace 'io.mrarm.irc'
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation('androidx.test.espresso:espresso-core:3.4.0-alpha02', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.camera:camera-camera2:1.7.0-alpha03'
    implementation 'androidx.camera:camera-lifecycle:1.7.0-alpha03'
    implementation 'androidx.camera:camera-video:1.7.0-alpha03'
    implementation 'androidx.camera:camera-view:1.7.0-alpha03'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation project(':chatlib')
    implementation('com.github.mcmrarm:chatlib-android-core:0.1.0') {
        exclude group: 'com.github.mcmrarm', module: 'chatlib'
    }
    // chatlib-android-storage 0.3.1 is included as source so its SQLite lock-order
    // deadlock can be fixed locally.
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'net.lingala.zip4j:zip4j:1.3.3'
    implementation 'com.madgag.spongycastle:core:1.58.0.0'
    implementation 'com.madgag.spongycastle:prov:1.58.0.0'
    implementation 'com.madgag.spongycastle:bcpkix-jdk15on:1.58.0.0'
    implementation 'com.github.mcmrarm:arscwriter:0.1.0'
    implementation 'com.github.mcmrarm:thememonkey:0.1.3'
    testImplementation 'junit:junit:4.13.2'
}
