apply plugin: 'com.android.application'
apply plugin: 'io.mrarm.irc.build.settings-builder'

def releasePropertiesFile = rootProject.file('keystore.properties')
def releaseProperties = new Properties()
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}

// Fail rather than silently using dynamic or changing application/test dependencies.
// This guards resolution stability; it does NOT pin bytes or replace SHA-256 verification.
configurations.configureEach {
    resolutionStrategy.failOnNonReproducibleResolution()
}

android {
    // Official Lua 5.5.1 sources are vendored; NDK is pinned for reproducibility.
    ndkVersion '28.2.13676358'
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    // TIARCA is Java-only: avoid adding the AGP 9 built-in Kotlin runtime to APKs.
    enableKotlin = false
    compileSdk 36
    defaultConfig {
        applicationId "io.tiarca.irc"
        minSdk 28
        targetSdk 36
        versionCode 91000
        versionName "0.9.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        vectorDrawables.useSupportLibrary = true
    }
    flavorDimensions += 'distribution'
    productFlavors {
        standard {
            dimension 'distribution'
            buildConfigField 'boolean', 'GITHUB_UPDATER_ENABLED', 'true'
        }
        fdroid {
            dimension 'distribution'
            buildConfigField 'boolean', 'GITHUB_UPDATER_ENABLED', 'false'
        }
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (releasePropertiesFile.exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file(releaseProperties['storeFile'])
                storePassword releaseProperties['storePassword']
                keyAlias releaseProperties['keyAlias']
                keyPassword releaseProperties['keyPassword']
            }
        }
    }
    packagingOptions {
        jniLibs {
            // CameraX ships these libraries in a form the Android strip task cannot process.
            // They were already packaged unchanged; declaring that explicitly avoids a noisy build notice.
            keepDebugSymbols += ['**/libimage_processing_util_jni.so', '**/libsurface_util_jni.so']
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releasePropertiesFile.exists()) signingConfig signingConfigs.release
        }
        debug { multiDexEnabled true }
    }
    namespace 'io.mrarm.irc'
    buildFeatures { buildConfig true }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    // Deliberately pin CameraX to 1.7.0-rc01 (phase C agreement).
    implementation 'androidx.camera:camera-camera2:1.7.0-rc01'
    implementation 'androidx.camera:camera-lifecycle:1.7.0-rc01'
    implementation 'androidx.camera:camera-video:1.7.0-rc01'
    implementation 'androidx.camera:camera-view:1.7.0-rc01'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation project(':chatlib')
    implementation('com.github.mcmrarm:chatlib-android-core:0.1.0') {
        exclude group: 'com.github.mcmrarm', module: 'chatlib'
    }
    // chatlib-android-storage 0.3.1 is included as source so its SQLite lock-order
    // deadlock can be fixed locally.
    // Security: override vulnerable transitive Guava 33.3.1-android.
    // GHSA-xxph-c9ww-hj94 / CVE-2026-102554 is fixed in 33.7.2-android.
    implementation 'com.google.guava:guava:33.7.2-android'
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation 'com.github.mcmrarm:arscwriter:0.1.0'
    implementation 'com.github.mcmrarm:thememonkey:0.1.3'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
}

tasks.withType(Test).configureEach {
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showStackTraces = true
    }
}
