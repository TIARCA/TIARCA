plugins {
    id 'java-library'
}

tasks.withType(JavaCompile).configureEach {
    // Keep chatlib compatible with Java 8. JDK 21 still reports Gradle's Java 8
    // compatibility flags as obsolete, so suppress only that compiler-options category.
    // Unchecked/deprecation warnings remain enabled by the root build.
    options.release.set(8)
    options.compilerArgs << "-Xlint:-options"
}

sourceSets {
    main.java.srcDirs = ['src/main/java']
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
