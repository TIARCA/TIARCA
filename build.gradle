// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.0'
        classpath 'io.mrarm.irc:build:1.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Only the com.github.mcmrarm libraries used by TIARCA may resolve from JitPack.
        // Never let this third-party repository act as a fallback for AndroidX or Maven Central.
        maven {
            url "https://jitpack.io"
            content {
                includeGroup 'com.github.mcmrarm'
            }
        }
    }
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
