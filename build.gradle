// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Gradle builds this Java-only app with AGP's built-in Kotlin integration off.
    // The settings-generator included build reintroduces AGP through gradle-api,
    // so exclude the unused, vulnerable Kotlin plugin from the *whole* classpath,
    // not just from one dependency edge.
    configurations.classpath {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-gradle-plugin'
    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.0'
        classpath 'io.mrarm.irc:build:1.0'

        // Patch vulnerable transitive *build-tool* components (not Android app runtime).
        // Keep these as constraints so unrelated artifacts are not added to the classpath.
        // Review on every AGP upgrade: the bundled AGP versions may eventually catch up.
        constraints {
            classpath('com.google.guava:guava:33.7.2-jre') {
                because 'GHSA-xxph-c9ww-hj94'
            }
            classpath('org.apache.commons:commons-lang3:3.18.0') {
                because 'GHSA-j288-q9x7-2f5v'
            }
            classpath('org.bitbucket.b_c:jose4j:0.9.6') {
                because 'GHSA-3677-xxcr-wjqv'
            }
            classpath('org.bouncycastle:bcpkix-jdk18on:1.86') {
                because 'GHSA-wg6q-6289-32hp'
            }
            classpath('org.bouncycastle:bcprov-jdk18on:1.86') {
                because 'GHSA-9pwp-9qqc-pr26 and GHSA-qp49-qgx5-5m26'
            }
            classpath('org.bouncycastle:bcutil-jdk18on:1.86') {
                because 'Keep Bouncy Castle modules aligned'
            }
            classpath('org.jdom:jdom2:2.0.6.1') {
                because 'GHSA-2363-cqg2-863c'
            }
        }

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Only the com.github.mcmrarm libraries used by TIARCA may resolve from JitPack.
        // Never let this third-party repository act as a fallback for AndroidX or Maven Central.
        maven {
            url "https://jitpack.io"
            content {
                includeGroup 'com.github.mcmrarm'
            }
        }
    }
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
